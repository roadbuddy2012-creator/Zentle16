<title>알구싸구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one bright phone column (max 480px) like a social shopping app — stories row, image-first feed posts (4:5 media, carousel, action row, caption), a full-screen vertical Shorts tab, bottom sheets for asking and paying, and a story viewer for "나의 쇼핑 DNA". White ground, ink type, sale-red accent with a warm story-ring gradient; product media sits on light studio tints. */
:root{
  --bg:#FFFFFF; --bg-2:#F6F5F3; --surface:#FFFFFF; --sunk:#F2F1EE;
  --ink:#111111; --ink-2:#3A3A38; --muted:#76746F; --faint:#AAA8A2;
  --line:#ECEAE6; --line-2:#DCD9D3;
  --hot:#FF4A1C; --hot-soft:#FFF0EA; --on-hot:#FFFFFF; --on-ink:#FFFFFF;
  --good:#1E8A4C; --bad:#D9480F; --bad-soft:#FFF1E9;
  --ring:linear-gradient(45deg,#FFC23D 0%,#FF6A2B 45%,#FF2D78 100%);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 12px 40px rgba(0,0,0,.16);
  --font-ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-brand:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0C; --bg-2:#161616; --surface:#151515; --sunk:#1D1D1D;
    --ink:#F5F5F3; --ink-2:#D5D3CD; --muted:#9D9B95; --faint:#67655F;
    --line:#262626; --line-2:#363636;
    --hot:#FF6A3D; --hot-soft:#2B170F; --on-hot:#FFFFFF; --on-ink:#111111;
    --good:#4ADE80; --bad:#FF8A5C; --bad-soft:#2B170F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --bg-2:#161616; --surface:#151515; --sunk:#1D1D1D;
  --ink:#F5F5F3; --ink-2:#D5D3CD; --muted:#9D9B95; --faint:#67655F;
  --line:#262626; --line-2:#363636;
  --hot:#FF6A3D; --hot-soft:#2B170F; --on-hot:#FFFFFF; --on-ink:#111111;
  --good:#4ADE80; --bad:#FF8A5C; --bad-soft:#2B170F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button,label[class]{cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
p,h1,h2,h3{margin:0}
ul{margin:0;padding:0;list-style:none}
img{max-width:100%}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.ic.xs{width:14px;height:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.minw{min-width:0}
.grow{flex:1;min-width:0}
.center{align-self:center}

/* shell */
.app{max-width:480px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom,0px))}
.app.no-nav{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px;background:var(--bg)}
.wm{font-family:var(--font-brand);font-weight:400;font-size:27px;letter-spacing:-.02em;line-height:1;border:0;background:none;padding:0;color:var(--ink)}
.wm i{font-style:normal;color:var(--hot)}
.wm.sm{font-size:22px}
.top-title{font-size:22px;font-weight:900;letter-spacing:-.03em}
.top-r{display:flex;gap:6px;align-items:center}
.pill-btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:2px}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hot-soft);color:var(--ink-2);border-radius:14px;padding:10px 14px;font-size:12.5px}
.demo-bar button{border:0;background:none;color:var(--hot);font-weight:700;font-size:12.5px;padding:2px 0;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:4px 16px calc(4px + env(safe-area-inset-bottom,0px))}
.nav nav{max-width:448px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nv{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--muted);font-size:10.5px;padding:6px 0 4px}
.nv .ic{width:24px;height:24px}
.nv[aria-current="page"]{color:var(--ink);font-weight:700}
.nv[aria-current="page"] .ic{stroke-width:2.2}
.nv-ask{justify-self:center;width:50px;height:38px;border-radius:14px;border:0;background:var(--ring);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(255,74,28,.32)}
.nv-ask .ic{width:22px;height:22px;stroke-width:2.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:14px;font-size:13.5px;width:max-content;max-width:min(420px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow-lg)}

/* common */
.eyebrow{font-size:12px;font-weight:700;color:var(--hot);letter-spacing:.02em}
.lead{color:var(--muted);font-size:14.5px;line-height:1.65}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.fine{font-size:11.5px;color:var(--faint);line-height:1.55;display:flex;gap:6px;align-items:flex-start}
.fine .ic{margin-top:2px}
.lbl{font-size:13px;font-weight:700;color:var(--ink-2);display:block}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-title{font-size:18px;font-weight:900;letter-spacing:-.03em}
.group{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-row{display:flex;gap:8px}
.add-row .field{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn-ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn-hot{background:var(--hot);color:var(--on-hot);border-color:var(--hot)}
.btn-block{width:100%;min-height:54px;font-size:15.5px;border-radius:16px}
.btn[disabled]{opacity:.4;cursor:default}
.btn-quiet{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 2px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;text-align:left}
.btn-quiet.center{align-self:center}
.btn-quiet.danger{color:var(--bad)}
.more{border:0;background:none;padding:0;color:var(--muted);font-size:13.5px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;text-decoration:none;text-align:left}
.icon-btn{width:36px;height:36px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink-2);flex:none}
.field{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px}
.field::placeholder{color:var(--faint)}
textarea.field{resize:vertical;min-height:96px;line-height:1.5}
.field.sm{padding:10px 12px;font-size:15px;border-radius:12px}
.field.xs{width:78px;text-align:right;padding:9px 10px;font-size:15px;border-radius:11px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;text-align:left}
.chip.hot{border-color:transparent;background:var(--hot-soft);color:var(--hot);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;color:var(--hot);background:var(--hot-soft);border-radius:999px;padding:2px 8px}
.notice{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-size:13.5px}
.seg{display:inline-flex;background:var(--bg-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:700}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);text-align:left}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
[aria-pressed="true"]>.box{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);padding:48px 16px;font-size:14px}
.empty .ic{width:40px;height:40px;stroke-width:1.2}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}

/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 2px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--ink-2)}
.story small{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:var(--ring);display:grid;place-items:center;flex:none}
.ring.off{background:var(--line-2)}
.av{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-weight:900;font-size:15px;color:var(--ink)}
.av img{width:100%;height:100%;object-fit:cover}
.av.txt{font-size:13px;letter-spacing:-.03em}
.av.hot{color:var(--hot)}
.av .ic{width:24px;height:24px}

/* scan */
.scan{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.scan-top{padding-bottom:4px}
.scan-h{font-size:31px;font-weight:900;letter-spacing:-.045em;line-height:1.22;text-wrap:balance}
.scan-h em{font-style:normal;background:var(--ring);-webkit-background-clip:text;background-clip:text;color:transparent}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:18px;overflow:hidden}
.pgrid .cell{position:relative;aspect-ratio:1;background:var(--sunk);display:block}
.pgrid .cell img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700;border:1.5px dashed var(--line-2);border-radius:4px;background:var(--bg-2)}
.pgrid .add .ic{width:28px;height:28px;color:var(--hot)}
.cell-x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--bg-2);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.privacy .ic{color:var(--hot);margin-top:2px}
.scan-cta{display:flex;flex-direction:column;gap:12px;border-radius:24px;padding:20px;background:var(--hot-soft)}
.scan-cta h2{font-size:21px;font-weight:900;letter-spacing:-.04em;line-height:1.3}
.scan-cta p{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.scan-cta .btn{align-self:flex-start}
.live{background:var(--bg-2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.steps{display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--faint)}
.steps li.on{color:var(--ink);font-weight:700}
.steps li.done{color:var(--muted)}
.steps li .ic{color:var(--hot)}
.typing{display:inline-flex;gap:4px;flex:none}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--hot);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* feed */
.feed{display:flex;flex-direction:column;gap:30px}
.post{display:flex;flex-direction:column;gap:10px}
.post-h{display:flex;align-items:center;gap:10px}
.av-s{width:36px;height:36px;border-radius:50%;background:var(--ring);padding:2px;flex:none}
.av-s>span{width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:900;color:var(--ink)}
.av-s img{width:100%;height:100%;object-fit:cover}
.av-s .ic{width:16px;height:16px}
.post-h b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.post-h small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.media{position:relative;border-radius:22px;overflow:hidden;background:var(--sunk)}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;position:relative;display:block;border:0;padding:0;margin:0;background:none;overflow:hidden;max-width:100%}
.poster{position:absolute;inset:0;display:grid;place-items:center;background:var(--tint,#F1EFEB);background-image:radial-gradient(120% 85% at 50% 28%,#FFFFFF 0%,rgba(255,255,255,0) 70%)}
.poster .ill{width:74%;max-height:80%;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.13))}
.ill-ic .ic{width:96px;height:96px;stroke-width:1;color:rgba(0,0,0,.5)}
.rank-tag{position:absolute;left:12px;top:12px;background:#111;color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:4px 10px}
.price-tag{position:absolute;right:12px;top:12px;background:#fff;color:#111;font-weight:900;font-size:13px;border-radius:999px;padding:5px 11px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.ill-tag{position:absolute;left:12px;bottom:12px;font-size:10.5px;font-weight:700;color:rgba(0,0,0,.55);background:rgba(255,255,255,.8);border-radius:999px;padding:3px 8px}
.photo-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stickers{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.sticker{background:#fff;color:#111;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 11px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.sticker::before{content:"+ ";color:#FF4A1C}
.dots{display:flex;justify-content:center;gap:5px;margin-top:-2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--hot)}
.acts{display:flex;align-items:center;gap:2px;margin:-4px 0 -4px -6px}
.act{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:6px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none}
.act .ic{width:25px;height:25px}
.act.on{color:var(--hot)}
.act.on .ic{fill:currentColor}
.act-pay{margin-left:auto;background:var(--hot-soft);color:var(--hot);border-radius:999px;padding:7px 12px}
.act-pay .ic{width:16px;height:16px}
.pl{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pct{color:var(--hot);font-weight:900;font-size:19px;letter-spacing:-.02em}
.pl b{font-size:19px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pl s{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.pl small{color:var(--muted);font-size:12px}
.pl-link{border:0;background:none;padding:0;color:var(--hot);font-size:12.5px;font-weight:700}
.cap{font-size:14px;line-height:1.6;color:var(--ink-2)}
.cap b{color:var(--ink);font-weight:700;margin-right:6px}
.sig{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);background:var(--bg-2);border-radius:999px;padding:5px 10px;align-self:flex-start;line-height:1.4}
.sig .ic{color:var(--hot)}
.detail{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.dt{display:flex;flex-direction:column;gap:8px}
.dt-name{font-size:14px;display:flex;gap:6px;align-items:baseline}
.dt-name b{color:var(--hot)}
.dt-name span{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc ul{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.5}
.pc li{display:flex;gap:6px}
.pc li::before{flex:none;font-weight:900}
.pc .plus li::before{content:"+";color:var(--good)}
.pc .minus li::before{content:"−";color:var(--bad)}
.sites{display:flex;gap:6px;flex-wrap:wrap}
.site{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;text-decoration:none;color:var(--ink-2);background:var(--surface)}
.site.strong{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.site .ic{opacity:.6}
.allsites{display:flex;flex-direction:column;gap:8px}
.sec-label{font-size:12px;font-weight:700;color:var(--muted)}
.note{display:flex;gap:12px;background:var(--bg-2);border-radius:18px;padding:14px 15px}
.n-ic{width:32px;height:32px;border-radius:10px;background:var(--surface);color:var(--hot);display:grid;place-items:center;flex:none}
.note-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.note-body b{font-size:14px;font-weight:700}
.note-body .n-sub{font-size:12.5px;color:var(--hot);font-weight:500}
.note-body p{font-size:13px;color:var(--ink-2);line-height:1.6}
.note-body .more{color:var(--hot);font-weight:700;font-size:12.5px}
.skel{display:flex;flex-direction:column;gap:10px}
.skel .sk-media{aspect-ratio:4/5;border-radius:22px;background:linear-gradient(100deg,var(--sunk) 30%,var(--bg-2) 50%,var(--sunk) 70%);background-size:200% 100%;animation:shine 1.4s infinite linear}
.skel .sk-line{height:12px;border-radius:6px;background:var(--sunk);width:70%}
@keyframes shine{to{background-position:-200% 0}}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg-2);border:0;border-radius:16px;padding:12px 14px}
.ex-ic{width:36px;height:36px;border-radius:12px;background:var(--surface);color:var(--hot);display:grid;place-items:center;flex:none}
.ex b{display:block;font-weight:700;font-size:14px}
.ex small{display:block;color:var(--muted);font-size:12px}

/* likes + me */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:0;text-align:left;min-width:0}
.tile .slide{border-radius:16px}
.tile b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span.pr{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.prof{display:flex;align-items:center;gap:20px}

  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(c)>=0){ aiState = 'off'; return 'AI를 쓸 수 없는 상태예요. claude.ai에서 이 페이지를 열고 AI 사용을 허용해 주세요.'; }
  if(c==='rate_limited') return 'AI 사용이 잠시 많아요. 조금 뒤에 다시 눌러 주세요.';
  if(c==='session_expired') return 'claude.ai에 다시 로그인한 뒤 시도해 주세요.';
  if(c==='refused') return '이 부탁은 도와드리기 어려워요. 다르게 말해 주세요.';
  if(c==='invalid_json' || c==='empty_completion') return '답을 정리하지 못했어요. 다시 시도해 주세요.';
  if(c==='prompt_too_large') return '대화가 너무 길어요. 새로 묻기로 시작해 주세요.';
  if(c==='images_unavailable' || c==='image_rejected' || c==='decode') return '이 사진은 읽을 수 없어요. 다른 사진을 골라 주세요.';
  return '연결이 잠시 끊겼어요. 다시 시도해 주세요.';
}

function cleanSvg(s){

function dday(date){ if(!date) return null; var a = Date.parse(date), b = Date.parse(TODAY); return isNaN(a) ? null : Math.round((a-b)/864e5); }

function tintOf(hex){
  if(!hexOk(hex)) return '#F1EFEB';
  var n = parseInt(hex.slice(1),16), r = n>>16&255, g = n>>8&255, b = n&255;
  function m(c, base){ return Math.round(base + (c-base)*0.24); }
  return 'rgb('+m(r,245)+','+m(g,243)+','+m(b,239)+')';
}

/* ---------- storage: claude.ai account (private per viewer) with a browser copy; photos stay on this device ---------- */
var LS_KEY = 'algussagu.v1';
function appForSave(){
  var a = clone(S.app);
  if(bytes(JSON.stringify(a)) > 220000){ a.feed.slice(6).forEach(function(p){ p.picks.forEach(function(x){ x.svg = ''; }); }); a.saved.forEach(function(s){ s.pick.svg = ''; }); }
  while(a.feed.length>4 && bytes(JSON.stringify(a)) > 220000) a.feed.pop();
  return a;
}
function chatsForSave(){
  var list = clone(S.chats.filter(function(c){ return c.msgs.length; }).slice(0,8));
  list.forEach(function(c){ c.msgs = c.msgs.slice(-30); });
  while(list.length && bytes(JSON.stringify({list:list})) > 220000){
    var last = list[list.length-1];
    if(list.length>1) list.pop(); else if(last.msgs.length>2) last.msgs = last.msgs.slice(2); else break;
  }
  return list;
}
function lsSave(){ if(demoBackup) return; try{ localStorage.setItem(LS_KEY, JSON.stringify({app:appForSave(), chats:chatsForSave()})); }catch(e){} }
var saveTimers = {};
function persist(key){
  if(demoBackup) return;
  lsSave();
  if(!refs[key]) return;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(function(){ writeRemote(key, 0); }, 600);
}
function writeRemote(key, attempt){
  var body = key==='app' ? appForSave() : {list:chatsForSave()};
  refs[key].set(body).catch(function(e){
    if(e && e.code==='unavailable' && attempt===0){ setTimeout(function(){ writeRemote(key,1); }, 800+Math.random()*1200); }
    else { toast('계정에 저장하지 못했어요. 이 기기에는 남아 있어요.'); }
  });
}
var IDB = null;
function idb(){
  if(IDB) return IDB;
  IDB = new Promise(function(res){
    try{ var r = indexedDB.open('algussagu', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ res(null); }; }
    catch(e){ res(null); }
  });
  return IDB;
}
function idbGet(k){ return idb().then(function(d){ if(!d) return null; return new Promise(function(res){ try{ var q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }catch(e){ res(null); } }); }); }
function idbSet(k, v){ return idb().then(function(d){ if(!d) return; try{ d.transaction('kv','readwrite').objectStore('kv').put(v, k); }catch(e){} }); }
function savePhotos(){ if(demoBackup) return; idbSet('photos', S.photos); }
function shrinkUrl(file, max){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max/Math.max(w,h));
      var c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w*k)); c.height = Math.max(1,Math.round(h*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej({code:'decode'}); };
    img.src = url;
  });
}
function dataUrlToBlob(u){
  var p = String(u).split(','), mime = (p[0].match(/:(.*?);/) || [])[1] || 'image/jpeg', bin = atob(p[1] || ''), a = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type:mime});
}

function send(text, opt){
  opt = opt || {};

  var img = opt.img!==undefined ? opt.img : S.ui.img;
  if(!text && !img){ toast('무엇을 찾을지 적어 주세요.'); var d = document.getElementById('draft'); if(d) d.focus(); return; }

function runTurn(c, images){
  var ctl = turnCtl = new AbortController();
  var first = c.msgs.filter(function(m){ return m.role==='user'; }).length===1;
  S.ui.busy = c.id; S.ui.live = {say:'', n:0}; S.ui.sheetScroll = 'bottom';
  persist('chats'); render();
  var o = {modelTier:first ? 'complex' : 'default', cache:false, signal:ctl.signal, onText:function(u){ if(ctl===turnCtl) liveUpdate(u.text); }};
  if(images) o.images = images;
  sample.json(turnPrompt(c, !!images), o).then(function(j){
    if(ctl!==turnCtl) return;
    var r = normAi(j);
    var m = {id:'m'+uid(), role:'ai', at:Date.now(), kind:r.kind, say:r.say, title:r.title, query:r.query, picks:r.picks, owned:r.owned, cheaper:r.cheaper, timing:r.timing, ask:r.ask, chips:r.chips, remembered:remember(r.remember), postId:null};
    if(!m.say && !m.picks.length) m.say = '답을 정리하지 못했어요. 조금 다르게 말해 주세요.';
    if(m.picks.length){
      var us = c.msgs.filter(function(x){ return x.role==='user'; }), q = us[0].text, last = us[us.length-1].text;
      var post = normPost({id:'p'+m.id, kind:r.kind==='look' ? 'look' : 'ask', ctx:q.length>28 ? q.slice(0,27)+'…' : q, src:'물어본 것'+(us.length>1 ? ' · '+last : (c.ctx ? ' · '+c.ctx : '')), photo:null, say:'', picks:m.picks, cheaper:r.cheaper, timing:r.timing, chatId:c.id});
      S.app.feed = [post].concat(S.app.feed.filter(function(p){ return p.chatId!==c.id; })).slice(0,16);
      m.postId = post.id; persist('app');
    }
    c.msgs.push(m); c.msgs = c.msgs.slice(-30); c.at = Date.now();
    S.ui.sheetScroll = 'm-'+m.id;
    finish();
  }).catch(function(e){
    if(ctl!==turnCtl) return;
    if(e && e.code==='cancelled'){
      var last = c.msgs[c.msgs.length-1];
      if(last && last.role==='user'){ c.msgs.pop(); if(!String(S.ui.draft||'').trim()) S.ui.draft = last.text; }
      if(!c.msgs.length){ S.chats = S.chats.filter(function(x){ return x!==c; }); S.cur = null; }
      finish(); toast('멈췄어요. 고쳐서 다시 보내 주세요.');
      return;
    }
    c.msgs.push({id:'m'+uid(), role:'ai', at:Date.now(), err:aiError(e), picks:[]});
    S.ui.sheetScroll = 'bottom';
    finish();
  });
  function finish(){ turnCtl = null; S.ui.busy = null; S.ui.live = null; persist('chats'); render(); }
}

    S.cur = null; var c = newChat(); c.ctx = x.name+' ('+[x.brand, x.where, won(x.price)].filter(Boolean).join(' · ')+')';
    S.ui.sheet = 'ask'; S.ui.draft = ''; render();
    var d = document.getElementById('draft'); if(d){ d.placeholder = '예: 더 싼 걸로, 다른 색은?'; d.focus(); }
  },
  pay:function(el){ S.ui.sheet = 'pay'; S.ui.sheetId = el.dataset.post; render(); },
  payCta:function(){ S.ui.sheet = 'pay'; S.ui.sheetId = null; render(); },
  toWallet:function(){ S.ui.sheet = null; S.tab = 'me'; render(); var x = document.getElementById('newCard'); if(x){ x.scrollIntoView({block:'center'}); x.focus({preventScroll:true}); } },
  basket:function(el){
    var p = postById(el.dataset.id); if(!p) return;
    var b = basketOf(p).slice(), i = +el.dataset.i, k = b.indexOf(i);
    if(k>=0){ if(b.length===1){ toast('하나는 골라 주세요.'); return; } b.splice(k,1); } else b.push(i);
    p.basket = b.sort(function(x,y){ return x-y; }); persist('app'); render();
  },
  storyDna:function(){ if(!S.app.dna) return; S.ui.story = {i:0}; render(); },
  storyAt:function(el){ S.ui.story = {i:+el.dataset.i}; render(); },
  storyNext:function(){ if(S.ui.story.i>=4){ S.ui.story = null; } else S.ui.story.i++; render(); },
  storyPrev:function(){ if(S.ui.story.i>0) S.ui.story.i--; render(); },
  closeStory:function(){ S.ui.story = null; render(); window.scrollTo(0,0); },
  storyScan:function(){ S.ui.page = 'scan'; S.ui.sheet = null; render(); window.scrollTo(0,0); },
  storyEvent:function(el){ var e = S.app.dna && S.app.dna.events[+el.dataset.i]; if(!e) return; send(e.what+(e.date ? '('+e.date+')' : '')+'에 필요한 '+(e.need || '것')+' 찾아줘', {fresh:true, img:null}); },
  storyStar:function(){ S.cur = null; S.ui.sheet = 'ask'; S.ui.starMode = true; render(); },
  storySale:function(){ S.ui.sheet = 'sales'; render(); },
  runScan:function(){ runScan(); },
  stopScan:function(){ if(scanCtl) scanCtl.abort(); },
  skipScan:function(){ S.app.scanSkip = true; persist('app'); S.ui.page = null; S.tab = 'home'; render(); },
  closeScan:function(){ S.ui.page = null; render(); },
  delPhoto:function(el){ S.photos = S.photos.filter(function(p){ return p.id!==el.dataset.id; }); savePhotos(); render(); },
  delPhotos:function(){ twoStep('photos', function(){ S.photos = []; savePhotos(); }); },
  feed:function(){ runFeed(false); },
  feedMore:function(){ runFeed(true); },
  dropImg:function(){ S.ui.img = null; render(); },
  editCard:function(el){ var i = +el.dataset.i; S.ui.editCard = S.ui.editCard===i ? null : i; S.ui.confirm = null; render(); },
  setVal:function(el){ setPath(el.dataset.path, el.dataset.v); afterSet(el.dataset.path); render(); },
  addCard:function(){ addCardByName(); },
  aiCard:function(el){ aiFillCard(+el.dataset.i); },
  addBenefit:function(el){ var c = S.app.wallet.cards[+el.dataset.i]; c.benefits = c.benefits || []; c.benefits.push({type:'discount', rate:'', scope:'online', merchants:'', cap:''}); persist('app'); render(); },
  delBenefit:function(el){ S.app.wallet.cards[+el.dataset.i].benefits.splice(+el.dataset.j, 1); persist('app'); render(); },
  delCard:function(el){ var i = +el.dataset.i; twoStep('card'+i, function(){ S.app.wallet.cards.splice(i,1); S.ui.editCard = null; persist('app'); }); },
  addPay:function(el){ S.app.wallet.pays.push({name:el.dataset.v, rate:'', where:''}); persist('app'); render(); },
  delPay:function(el){ S.app.wallet.pays.splice(+el.dataset.i, 1); persist('app'); render(); },
  addPoint:function(){ S.app.wallet.points.push({name:'', balance:'', where:''}); persist('app'); render(); var x = document.getElementById('ptn'+(S.app.wallet.points.length-1)); if(x) x.focus(); },
  delPoint:function(el){ S.app.wallet.points.splice(+el.dataset.i, 1); persist('app'); render(); },
  addMember:function(el){ MEMBER_PRESETS.forEach(function(p){ if(p.name===el.dataset.v) S.app.wallet.members.push(clone(p)); }); persist('app'); render(); },
  delMember:function(el){ S.app.wallet.members.splice(+el.dataset.i, 1); persist('app'); render(); },
  memShip:function(el){ var m = S.app.wallet.members[+el.dataset.i]; if(!m) return; m.freeShip = !(m.freeShip===true || m.freeShip==='true'); persist('app'); render(); },
  addMem:function(){ addMemory(); },
  delMem:function(el){ S.app.memory.splice(+el.dataset.i, 1); persist('app'); render(); },
  resetAll:function(){ twoStep('reset', function(){
    if(turnCtl) turnCtl.abort(); if(scanCtl) scanCtl.abort();
    S.app = freshApp(); S.chats = []; S.cur = null; S.photos = []; S.tab = 'home';
    S.ui = freshUi(); S.ui.page = 'scan';
    savePhotos(); persist('app'); persist('chats');
  }); }
};

$app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el || !$app.contains(el)) return;
  var f = A[el.dataset.act]; if(!f) return;
  e.preventDefault(); f(el, e);
});
$app.addEventListener('input', function(e){
  var el = e.target; if(!el.dataset || !el.dataset.bind || el.tagName==='SELECT') return;
  var v = el.hasAttribute('data-num') ? (el.value.trim()==='' ? '' : num(el.value)) : el.value;
  setPath(el.dataset.bind, v); afterSet(el.dataset.bind);
  if(el.id==='draft') fitDraft();
  if(el.id==='scan-text'){ var b = document.querySelector('[data-act="runScan"]'); if(b) b.disabled = !(S.photos.length || String(v).trim()); }
});
$app.addEventListener('change', function(e){
  var el = e.target;
  if(el.dataset.file){ onFile(el); el.value = ''; return; }
  if(el.dataset.bind && el.tagName==='SELECT'){ setPath(el.dataset.bind, el.value); afterSet(el.dataset.bind); if(el.hasAttribute('data-rerender')) render(); }
});
$app.addEventListener('keydown', function(e){
  if(e.key==='Escape' && (S.ui.sheet || S.ui.story)){ S.ui.sheet = null; S.ui.story = null; render(); return; }
  if(S.ui.story && (e.key==='ArrowRight' || e.key==='ArrowLeft')){ (e.key==='ArrowRight' ? A.storyNext : A.storyPrev)(); return; }
  if(e.key!=='Enter' || e.isComposing || e.keyCode===229) return;
  var id = e.target && e.target.id;
  if(id==='draft' && !e.shiftKey){ e.preventDefault(); send(S.ui.draft); }
  else if(id==='newCard'){ e.preventDefault(); addCardByName(); }
  else if(id==='memNew'){ e.preventDefault(); addMemory(); }
});

/* ---------- boot ---------- */
var cached = lsLoad(LS_KEY), migrated = false;
if(cached){ S.app = mergeApp(cached.app); S.chats = mergeChats(cached.chats); }
else { var old = lsLoad('gyeot.v1'); if(old && old.app){ S.app = mergeApp(fromV3(old.app, old.closet)); migrated = true; lsSave(); } }
if(!S.app.dna && !S.app.scanSkip) S.ui.page = 'scan';
render();
idbGet('photos').then(function(list){ if(Array.isArray(list) && !demoBackup){ S.photos = list.filter(function(p){ return p && p.id && /^data:image\//.test(String(p.url)); }).slice(0, MAX_PHOTOS); render(); } });

(function boot(){
  var c = window.claude;
  if(!c || typeof c.use!=='function'){ aiState = 'off'; render(); return; }
  c.use('sample').then(function(s){
    sample = s; aiState = s ? 'on' : 'off';
    if(s && s.limits){ s.limits().then(function(l){ S.ui.imgOk = !!(l && l.images); S.ui.imgMax = l && l.images ? l.images.maxCount : 0; render(); }, function(){}); }
    render();
  }, function(){ aiState = 'off'; render(); });
  c.use('comments').then(function(cm){ comments = cm; if(cm) render(); }, function(){});
  Promise.all([c.use('user'), c.use('db')]).then(function(x){
    var u = x[0], d = x[1]; if(!u || !d) return null;
    return u.id().then(function(id){
      if(!id) return null;
      var base = 'data/users/'+id;
      var r = {app:d.doc(base+'/ag_app'), chats:d.doc(base+'/ag_chats')};
      return Promise.all([r.app.get(), r.chats.get()]).then(function(g){
        refs.app = r.app; refs.chats = r.chats; storage = 'cloud';
        var T = demoBackup || S; /* 예시를 보는 중이면 계정 데이터는 보관본에 넣는다 */
        var q = g[1].exists && g[1].data();
        if(q && Array.isArray(q.list)) T.chats = mergeChats(q);
        else if(T.chats.length) persist('chats');
        if(g[0].exists){ T.app = mergeApp(g[0].data()); }
        else if(cached || migrated){ persist('app'); }
        else return Promise.all([d.doc(base+'/app').get(), d.doc(base+'/closet').get()]).then(function(o){
          if(o[0].exists){ T.app = mergeApp(fromV3(o[0].data(), o[1].exists ? o[1].data() : null)); persist('app'); }
          settle();
        }, settle);
        settle();
        function settle(){ lsSave(); if(!demoBackup && S.ui.page==='scan' && (S.app.dna || S.app.scanSkip) && !S.ui.scan.busy) S.ui.page = null; render(); }
      });
    });
  }).catch(function(){ /* 계정 저장소를 못 쓰면 이 기기에만 저장 */ });
})();

})();
</script>
