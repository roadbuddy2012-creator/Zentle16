<title>알구싸구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column (max 460px). Sticky wordmark header; three tabs (물어보기 · 연예인 코디 · 내 지갑) in a floating ink bar; on 물어보기 the chat composer floats just above the bar. Ivory ground, ink type, champagne-gold accent, Hahmlet serif for display type. */
:root{
  --bg:#F5F1EA; --bg-2:#ECE6DB; --surface:#FFFFFF; --surface-2:#FAF7F1;
  --ink:#15171C; --ink-2:#34373E; --muted:#6E685F; --faint:#9A9388;
  --line:#E3DCCF; --line-2:#D2C8B7;
  --gold:#8F6B2C; --gold-2:#B8935A; --gold-soft:#F2E8D7;
  --on-ink:#F7F2E8; --on-gold:#FFFFFF;
  --bar:#16181D; --bar-fg:#B9B2A5; --bar-on:#E2C592;
  --good:#3B6A4C; --bad:#9A4B32; --bad-soft:#F7E8E0;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 12px 32px rgba(40,30,10,.07);
  --shadow-lg:0 2px 6px rgba(20,16,8,.12),0 18px 40px rgba(20,16,8,.20);
  --font-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-display:"Hahmlet","Apple SD Gothic Neo","Noto Serif KR",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --bg-2:#17181C; --surface:#18191E; --surface-2:#1E1F25;
    --ink:#F0EADF; --ink-2:#D6CFC2; --muted:#A39C90; --faint:#787166;
    --line:#2B2C32; --line-2:#3C3D44;
    --gold:#D6B47C; --gold-2:#C9A66E; --gold-soft:#2A2419;
    --on-ink:#15171C; --on-gold:#15171C;
    --bar:#202127; --bar-fg:#A39C90; --bar-on:#E4C894;
    --good:#8FC0A0; --bad:#E5A086; --bad-soft:#35231C;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.30);
    --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --bg-2:#17181C; --surface:#18191E; --surface-2:#1E1F25;
  --ink:#F0EADF; --ink-2:#D6CFC2; --muted:#A39C90; --faint:#787166;
  --line:#2B2C32; --line-2:#3C3D44;
  --gold:#D6B47C; --gold-2:#C9A66E; --gold-soft:#2A2419;
  --on-ink:#15171C; --on-gold:#15171C;
  --bar:#202127; --bar-fg:#A39C90; --bar-on:#E4C894;
  --good:#8FC0A0; --bad:#E5A086; --bad-soft:#35231C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.30);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button,label[class]{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
p,h1,h2,h3{margin:0}
ul{margin:0;padding:0;list-style:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.ic.xs{width:14px;height:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.minw{min-width:0}
.grow{flex:1;min-width:0}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{max-width:460px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
.app.with-composer{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 14px;background:var(--bg)}
.wordmark{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:none;border:0;padding:0;text-align:left}
.wm{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.04em;line-height:1;display:flex;align-items:center;gap:7px}
.wm i{font-style:normal;color:var(--gold)}
.wm::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.wm-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;padding-left:14px}
.top-right{display:flex;gap:6px;align-items:center}
.pill-btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);white-space:nowrap}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--gold-soft);color:var(--ink-2);border-radius:14px;padding:10px 14px;font-size:13px}
.demo-bar button{border:0;background:none;color:var(--gold);font-weight:600;font-size:13px;padding:2px 0;flex:none}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:2px}

.tabs{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.tabs nav{pointer-events:auto;width:100%;max-width:428px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bar);border-radius:22px;padding:6px;box-shadow:var(--shadow-lg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--bar-fg);font-size:11.5px;letter-spacing:.02em;padding:8px 0 7px;border-radius:16px}
.tab[aria-current="page"]{color:var(--bar-on);background:rgba(255,255,255,.07);font-weight:500}
.composer-wrap{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.composer{pointer-events:auto;width:100%;max-width:428px;background:var(--surface);border:1px solid var(--line-2);border-radius:22px;box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column;gap:4px}
.composer-row{display:flex;align-items:flex-end;gap:2px}
.composer textarea{flex:1;min-width:0;border:0;background:none;resize:none;outline:none;font-size:16px;line-height:1.45;padding:9px 6px;max-height:132px;height:41px}
.composer textarea::placeholder{color:var(--faint)}
.cbtn{width:41px;height:41px;border-radius:15px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none}
.cbtn.send{background:var(--ink);color:var(--on-ink)}
.attach{display:flex;align-items:center;gap:10px;padding:4px 6px;font-size:12.5px;color:var(--muted)}
.attach img{width:42px;height:42px;object-fit:cover;border-radius:10px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:14px;font-size:13.5px;width:max-content;max-width:min(420px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow-lg)}

/* type + common */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.display{font-family:var(--font-display);font-weight:600;font-size:35px;line-height:1.2;letter-spacing:-.045em}
.display.sm{font-size:29px}
.display em{font-style:normal;color:var(--gold)}
.lead{color:var(--muted);font-size:14.5px;line-height:1.65}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.fine{font-size:11.5px;color:var(--faint);line-height:1.55;display:flex;gap:6px;align-items:flex-start}
.fine .ic{margin-top:2px}
.sec-label{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-title{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.03em}
.group{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2);display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-row{display:flex;gap:8px}
.add-row .field{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn-ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn-gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn-block{width:100%;min-height:54px;font-size:15.5px;border-radius:16px}
.btn[disabled]{opacity:.5;cursor:default}
.btn-quiet{border:0;background:none;color:var(--muted);font-size:13.5px;padding:6px 2px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;text-align:left}
.btn-quiet.danger{color:var(--bad)}
.more{border:0;background:none;padding:2px 0;color:var(--gold);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;text-decoration:none;text-align:left}
.icon-btn{width:34px;height:34px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none}
.field{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px}
.field::placeholder{color:var(--faint)}
.field.sm{padding:10px 12px;font-size:15px;border-radius:12px}
.field.xs{width:78px;text-align:right;padding:9px 10px;font-size:15px;border-radius:11px;font-variant-numeric:tabular-nums}
select.field{appearance:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--ink);text-decoration:none;text-align:left}
.chip.gold{border-color:var(--gold-2);color:var(--gold);background:var(--gold-soft);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--gold);border:1px solid var(--gold-2);border-radius:999px;padding:1px 8px;vertical-align:middle}
.notice{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-size:13.5px}
.seg{display:inline-flex;background:var(--bg-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:500}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);text-align:left;width:100%}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
[aria-pressed="true"]>.box{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.hero.tight{padding-top:4px;gap:10px}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.flow div{background:var(--surface);padding:14px 14px 15px;display:flex;flex-direction:column;gap:4px}
.flow b{font-family:var(--font-display);color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.02em}
.flow span{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.ex-ic{width:38px;height:38px;border-radius:12px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}
.ex b{display:block;font-weight:500;font-size:14.5px}
.ex small{display:block;color:var(--muted);font-size:12.5px}
.ex>.ic{color:var(--faint)}
.list-rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.lr{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.lr:first-child{border-top:0}
.lr .nm{flex:1;min-width:0;font-size:14.5px}
.lr .full{flex-basis:100%}
.lr-btn{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column}
.lr-btn small{color:var(--muted);font-size:12px}

/* chat */
.thread{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.m-user{align-self:flex-end;max-width:86%;background:var(--ink);color:var(--on-ink);border-radius:20px 20px 6px 20px;padding:11px 15px;font-size:15px;white-space:pre-wrap}
.u-img{display:inline-flex;align-items:center;gap:4px;font-size:12px;opacity:.75;margin-right:6px}
.m-ai{display:flex;flex-direction:column;gap:14px}
.ai-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.ai-mark{width:24px;height:24px;border-radius:8px;background:var(--bar);color:var(--bar-on);display:grid;place-items:center;font-family:var(--font-display);font-size:12.5px;font-weight:700}
.say{font-size:15.5px;line-height:1.7;white-space:pre-wrap}
.live{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.typing{display:inline-flex;gap:4px;flex:none}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold-2);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.typing i{animation:none;opacity:.7}}
.live .row{justify-content:flex-start}
.res-head{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.res-title{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.3}
.res-src{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.res-src .ic{color:var(--gold);margin-top:2px}
.res-total{font-size:13.5px;color:var(--ink-2)}
.res-total b{font-variant-numeric:tabular-nums}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.pick.first{border-color:var(--gold-2)}
.pick-top{display:flex;gap:14px;align-items:flex-start}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.thumb{position:relative;width:76px;height:76px;border-radius:18px;flex:none;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);border:1px solid var(--line)}
.thumb.sw{background:var(--sw);background:linear-gradient(145deg,color-mix(in srgb,var(--sw) 72%,#fff) 0%,var(--sw) 70%);color:var(--sw-fg);border-color:transparent}
.thumb .ic{width:34px;height:34px;stroke-width:1.3}
.thumb .rk{position:absolute;left:8px;top:6px;font-family:var(--font-display);font-size:12.5px;font-weight:600;letter-spacing:-.02em;opacity:.85}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{min-height:40px;font-size:13.5px;padding:0 14px;border-radius:12px}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.palette span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;background:var(--surface)}
.palette i{width:16px;height:16px;border-radius:50%;background:var(--sw);border:1px solid rgba(0,0,0,.12)}
.allsites{display:flex;flex-direction:column;gap:8px}
.pick-name{font-weight:600;font-size:16px;line-height:1.42}
.pick-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.price{font-size:21px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.price small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}
.why{font-size:14.5px;color:var(--ink-2);line-height:1.65}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc ul{display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.5}
.pc li{display:flex;gap:6px}
.pc li::before{flex:none;font-weight:600}
.pc .plus li::before{content:"+";color:var(--good)}
.pc .minus li::before{content:"−";color:var(--bad)}
.signal{display:flex;gap:8px;align-items:flex-start;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;color:var(--ink-2);line-height:1.55}
.signal .ic{color:var(--gold);margin-top:2px}
.sites{display:flex;gap:6px;flex-wrap:wrap}
.site{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;text-decoration:none;color:var(--ink-2);background:var(--surface)}
.site .ic{color:var(--faint)}
.mypay{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px dashed var(--line-2);padding-top:11px;font-size:12.5px;color:var(--muted)}
.mypay span{display:flex;gap:6px;align-items:center;min-width:0}
.mypay b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.note{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 16px}
.n-ic{width:34px;height:34px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}
.note-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.note-body b{font-size:14.5px;font-weight:600}
.note-body .n-sub{font-size:12.5px;color:var(--gold)}
.note-body p{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.ask-box{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--gold-2);padding:2px 0 2px 14px}
.ask-q{font-size:14.5px;font-weight:500}
.remembered{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.remembered .ic{color:var(--gold);margin-top:2px}

/* payment */
.paycta{background:var(--bar);color:#F7F2E8;border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.paycta::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(214,180,124,.28),transparent 70%);pointer-events:none}
.paycta .eyebrow{color:#E2C592}
.paycta h3{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.4}
.paycta p{font-size:13px;color:#BDB6A9}
.paycta .btn{background:transparent;border-color:rgba(247,242,232,.28);color:#F7F2E8}
.paycta .btn-gold{background:#D6B47C;border-color:#D6B47C;color:#15171C}
.paycta .btn-quiet{color:#BDB6A9}
.paybar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--gold-2);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.paybar .pb-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.paybar .pb-l b{font-size:14px;font-weight:500}
.paybar .pb-r{display:flex;align-items:center;gap:4px;flex:none;text-align:right}

/* ---------- photos: shrink in the page; sent to the AI only, never stored ---------- */
function shrink(file, max){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max/Math.max(w,h));
      var c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w*k)); c.height = Math.max(1,Math.round(h*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var t = document.createElement('canvas'), tk = Math.min(1, 120/Math.max(w,h)); t.width = Math.max(1,Math.round(w*tk)); t.height = Math.max(1,Math.round(h*tk));
      t.getContext('2d').drawImage(img, 0, 0, t.width, t.height);
      URL.revokeObjectURL(url);
      var thumb = t.toDataURL('image/jpeg', 0.7);
      c.toBlob(function(b){ if(b) res({blob:b, thumb:thumb}); else rej({code:'decode'}); }, 'image/jpeg', 0.84);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej({code:'decode'}); };
    img.src = url;
  });
}

/* ---------- 결제 계산 (금액은 AI가 아니라 코드가 계산) ---------- */
function hit(list, where){
  var w = norm(where); if(!w) return false;
  return String(list||'').split(/[,/·\n]+/).map(norm).filter(Boolean).some(function(m){ return w.indexOf(m)>=0 || m.indexOf(w)>=0; });
}
function payUsable(p, o){ return !String(p.where||'').trim() || hit(p.where, o.where); }
function hasWallet(){ var w = S.app.wallet; return w.cards.some(function(c){ return c.name; }) || w.pays.some(function(p){ return p.name; }); }
function orderOf(p){ return {name:p.name, where:p.where||'온라인', channel:p.channel||'online', price:Math.max(0,num(p.price)), shipping:Math.max(0,num(p.shipping))}; }
function membersFor(o){ return S.app.wallet.members.filter(function(m){ return m.name && hit(m.where||m.name, o.where); }); }
/* 카드 한 장의 혜택 중 가장 큰 것 하나. used는 이번 계산에서 이미 쓴 월 한도 */
function cardBen(card, o, base, used){
  var out = {amount:0, type:'discount', capped:false, cap:0, rate:0, key:''};
  if(!card || card.met==='no' || base<=0) return out;
  (card.benefits||[]).forEach(function(b, j){
    var rate = num(b.rate); if(rate<=0) return;
    var sc = b.scope || 'online';
    var ok = sc==='all' || (sc==='online' && o.channel==='online') || (sc==='delivery' && o.channel==='delivery') || (sc==='merchant' && hit(b.merchants, o.where));
    if(!ok) return;
    var key = (card.id||card.name)+':'+j, amt = Math.floor(base*rate/100), cap = num(b.cap), capped = false;
    if(cap>0){ var left = Math.max(0, cap-(used[key]||0)); if(amt>left){ amt = left; capped = true; } }
    if(amt>out.amount || (!out.key && amt===0)){ out = {amount:amt, type:BTYPE[b.type] ? b.type : 'discount', capped:capped, cap:cap, rate:rate, key:key}; }
  });
  return out;
}
function evalPlan(orders, assign, ptsUse){
  var used = {}, T = {rows:[], plain:0, real:0, cash:0, pts:0, later:0};
  orders.forEach(function(o, i){
    var m = assign[i] || {card:null, pay:null}, mem = membersFor(o);
    var free = mem.filter(function(x){ return x.freeShip===true || x.freeShip==='true'; })[0] || null;
    var ship = free ? 0 : o.shipping, base = o.price + ship;
    var pts = Math.min(base, ptsUse ? (ptsUse[i]||0) : 0), charged = base - pts;
    var b = cardBen(m.card, o, charged, used);
    if(b.key && b.amount>0) used[b.key] = (used[b.key]||0) + b.amount;
    var disc = b.type==='discount' ? b.amount : 0, back = b.type==='discount' ? 0 : b.amount;
    var payR = m.pay ? Math.floor(charged*num(m.pay.rate)/100) : 0;
    var memR = mem.reduce(function(s,x){ return s+Math.floor(base*num(x.rate)/100); }, 0);
    var r = {o:o, m:m, b:b, mem:mem, free:free, shipSaved:o.shipping-ship, base:base, pts:pts, disc:disc, back:back, payR:payR, memR:memR, cash:charged-disc, later:back+payR+memR, ptNames:[]};
    r.real = base - disc - back - payR - memR;
    T.rows.push(r); T.plain += o.price+o.shipping; T.real += r.real; T.cash += r.cash; T.pts += pts; T.later += r.later;
  });
  return T;
}
function methodsFor(o){
  var w = S.app.wallet, cards = w.cards.filter(function(c){ return c.name; }), pays = w.pays.filter(function(p){ return p.name && payUsable(p, o); });
  var L = [{card:null, pay:null}];
  cards.forEach(function(c){ L.push({card:c, pay:null}); pays.forEach(function(p){ L.push({card:c, pay:p}); }); });
  pays.forEach(function(p){ L.push({card:null, pay:p}); });
  return L;
}
function nUsed(m){ return (m.card?1:0)+(m.pay?1:0); }
/* 주문마다 카드·Pay를 배정하는 모든 경우를 따져(많으면 큰 주문부터 하나씩) 실제 부담이 가장 적은 조합을 고르고, 포인트는 혜택을 가장 덜 깎는 주문에 쓴다 */
function bestPlan(orders, opt){
  opt = opt || {};
  var M = orders.map(function(o){
    return methodsFor(o).map(function(m){ return {m:m, v:evalPlan([o],[m],null).real}; })
      .sort(function(a,b){ return (a.v-b.v) || (nUsed(a.m)-nUsed(b.m)); }).slice(0,6).map(function(x){ return x.m; });
  });
  var space = M.reduce(function(s,x){ return s*x.length; }, 1), best = [], bestV = Infinity, bestN = Infinity;
  if(space <= 6000){
    var cur = [];
    (function rec(i){
      if(i===orders.length){
        var t = evalPlan(orders, cur, null), n = cur.reduce(function(s,m){ return s+nUsed(m); }, 0);
        if(t.real<bestV || (t.real===bestV && n<bestN)){ bestV = t.real; bestN = n; best = cur.slice(); }
        return;
      }
      for(var k=0;k<M[i].length;k++){ cur[i] = M[i][k]; rec(i+1); }
    })(0);
  } else {
    var seq = orders.map(function(o,i){ return i; }).sort(function(a,b){ return orders[b].price-orders[a].price; }), done = [];
    seq.forEach(function(i){
      var bm = M[i][0], bv = Infinity;
      M[i].forEach(function(m){
        best[i] = m; var idx = done.concat([i]).sort(function(a,b){ return a-b; });
        var v = evalPlan(idx.map(function(k){ return orders[k]; }), idx.map(function(k){ return best[k]; }), null).real;
        if(v<bv){ bv = v; bm = m; }
      });
      best[i] = bm; done.push(i);
    });
  }
  /* 포인트는 카드 할인·적립을 깎지 않는 곳에만 쓰고, 깎이면 아껴 두는 쪽이 얼마나 이득인지 알려 준다 */
  var ptsUse = null, names = orders.map(function(){ return []; }), skip = {amount:0, loss:0};
  var points = opt.points ? S.app.wallet.points.filter(function(p){ return p.name && num(p.balance)>0; }) : [];
  if(points.length){
    ptsUse = orders.map(function(){ return 0; });
    points.forEach(function(p){
      var left = num(p.balance);
      for(var guard=0; left>0 && guard<orders.length; guard++){
        var cand = -1, cv = Infinity, now = evalPlan(orders, best, ptsUse);
        orders.forEach(function(o, i){
          if(String(p.where||'').trim() && !hit(p.where, o.where)) return;
          var room = now.rows[i].base - ptsUse[i]; if(room<=0) return;
          var trial = ptsUse.slice(); trial[i] += Math.min(left, room);
          var v = evalPlan(orders, best, trial).real;
          if(v<cv){ cv = v; cand = i; }

        if(cand<0) break;
        if(cv>now.real){ skip.amount += left; skip.loss += cv-now.real; break; }
        var use = Math.min(left, now.rows[cand].base - ptsUse[cand]);
        ptsUse[cand] += use; left -= use; names[cand].push(p.name);
      }
    });
  }
  var T = evalPlan(orders, best, ptsUse);
  T.rows.forEach(function(r, i){
    r.ptNames = names[i];
    if(r.m.card && num(r.m.card.freeInstall)>=2 && r.cash>=50000) r.inst = Math.floor(num(r.m.card.freeInstall));
  });
  var cardsUsed = {}; T.rows.forEach(function(r){ if(r.m.card) cardsUsed[r.m.card.name] = 1; });
  var nCards = Object.keys(cardsUsed).length, allCards = S.app.wallet.cards.filter(function(c){ return c.name; }).length;
  T.tips = []; T.notes = [];
  if(orders.length>1 && nCards>1) T.tips.push('주문을 '+orders.length+'건으로 나눠 카드 '+nCards+'장에 배분했어요. 카드마다 할인 한도를 따로 써서 더 아껴요.');
  if(orders.length===1 && allCards>1) T.tips.push('한 주문은 보통 카드 1장으로만 결제돼요. 함께 살 물건이 있으면 주문을 나눠 다른 카드로 결제하면 혜택을 더 받을 수 있어요.');
  if(T.rows.some(function(r){ return r.b.capped; })) T.tips.push('카드 월 할인 한도에 닿은 주문이 있어요. 한도까지만 계산했어요.');
  if(T.pts>0) T.tips.push('포인트는 카드와 한 번에 같이 낼 수 있는(복합결제) 곳이 많아요. 결제 화면에서 포인트 사용을 먼저 누르세요.');
  if(skip.amount>0) T.tips.push('포인트 '+won(skip.amount)+'는 이번엔 아껴 두는 게 '+won(skip.loss)+' 더 이득이에요. 포인트로 낸 만큼 카드 할인·적립이 줄어서요. 현금 지출을 줄이고 싶으면 써도 돼요.');
  T.notes.push('이번 달 카드 한도는 아직 쓰지 않았다고 보고 계산했어요.');
  if(T.rows.some(function(r){ return r.m.card && r.m.card.met!=='yes'; })) T.notes.push('전월 실적을 모르는 카드는 충족했다고 보고 계산했어요.');
  if(T.rows.some(function(r){ return r.m.card && r.m.pay; })) T.notes.push('Pay로 결제할 때도 카드 혜택이 들어오는지 카드사 안내를 확인하세요.');
  if(T.pts) T.notes.push('포인트로 낸 금액에는 카드 혜택이 붙지 않는다고 봤어요.');
  T.notes.push('가격은 AI 예상가예요. 쿠폰·즉시할인은 구매처에서 확인하세요.');
  return T;
}

/* ---------- AI (claude.ai sample capability) ---------- */
function aiError(e){
  var c = e && e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(c)>=0){ aiState = 'off'; return 'AI를 쓸 수 없는 상태예요. claude.ai에서 이 페이지를 열고 AI 사용을 허용해 주세요.'; }
  if(c==='rate_limited') return 'AI 사용이 잠시 많아요. 조금 뒤에 다시 눌러 주세요.';
  if(c==='session_expired') return 'claude.ai에 다시 로그인한 뒤 시도해 주세요.';
  if(c==='refused') return '이 부탁은 도와드리기 어려워요. 다르게 말해 주세요.';
  if(c==='invalid_json' || c==='empty_completion') return '답을 정리하지 못했어요. 다시 시도해 주세요.';
  if(c==='prompt_too_large') return '대화가 너무 길어요. 새로 묻기로 시작해 주세요.';
  if(c==='images_unavailable' || c==='image_rejected' || c==='decode') return '이 사진은 읽을 수 없어요. 다른 사진을 골라 주세요.';
  return '연결이 잠시 끊겼어요. 다시 시도해 주세요.';
}
function aiMissing(){ toast(aiState==='checking' ? 'AI를 준비하고 있어요. 잠시 뒤 다시 눌러 주세요.' : '지금은 AI를 쓸 수 없어요. 예시로 둘러보기는 할 수 있어요.'); }
function memoryText(){ var m = S.app.memory; return m.length ? m.slice(-30).map(function(x){ return '- '+x; }).join('\n') : '- 아직 없음'; }
function memberText(){ var n = S.app.wallet.members.filter(function(x){ return x.name; }).map(function(x){ return x.name; }); return n.length ? '- 쇼핑 멤버십: '+n.join(', ')+' (해당 판매처의 무료배송·적립을 고려해도 됨)' : ''; }
function transcript(c){
  return c.msgs.slice(-12).map(function(m){
    if(m.role==='user') return '사용자: '+m.text+(m.img ? ' (사진 첨부)' : '');
    if(m.err) return '';
    var s = '알구싸구: '+(m.say||'');
    if(m.picks && m.picks.length) s += '\n  [보여준 결과] '+m.picks.map(function(p,i){ return (i+1)+') '+(p.part ? p.part+' - ' : '')+p.name+' / '+(p.brand||'')+' / '+(p.where||'')+' / '+won(p.price); }).join(' ; ');
    if(m.ask && m.ask.q) s += '\n  [물어본 것] '+m.ask.q;
    return s;
  }).filter(Boolean).join('\n');
}

function normAi(j){
  j = j && typeof j==='object' ? j : {};
  var kind = ['results','look','answer'].indexOf(j.kind)>=0 ? j.kind : 'results';
  var picks = (Array.isArray(j.picks) ? j.picks : []).map(function(x){
    x = x || {};
    return {name:str(x.name,''), brand:str(x.brand,''), part:str(x.part,''), tag:str(x.tag,''), color:hexOk(x.color) ? x.color : '', why:str(x.why,''), good:strList(x.good,3), bad:strList(x.bad,2), signal:str(x.signal,''), fit:str(x.fit,''), price:Math.round(num(x.price)), shipping:Math.round(num(x.shipping)), where:str(x.where,'온라인'), channel:['online','delivery','offline'].indexOf(x.channel)>=0 ? x.channel : 'online', searchQuery:str(x.searchQuery, str(x.name,'')), icon:ITEM_ICONS.indexOf(x.icon)>=0 ? x.icon : 'box'};
  }).filter(function(p){ return p.name && p.price>0; }).slice(0, kind==='look' ? 6 : 3);
  if(!picks.length) kind = 'answer'; else if(kind==='answer') kind = 'results';
  var o = j.owned && typeof j.owned==='object' ? j.owned : {}, c = j.cheaper && typeof j.cheaper==='object' ? j.cheaper : {};
  var t = j.timing && typeof j.timing==='object' ? j.timing : {}, a = j.ask && typeof j.ask==='object' ? j.ask : {};
  return {kind:kind, say:str(j.say,''), title:str(j.title,''), query:str(j.query,''), picks:picks,
    owned:{why:picks.length ? str(o.why,'') : ''},
    cheaper:{show:!!c.show && !!str(c.where,'') && picks.length>0, where:str(c.where,''), what:str(c.what,''), price:str(c.price,''), delivery:str(c.delivery,''), why:str(c.why,''), caution:str(c.caution,''), searchQuery:str(c.searchQuery,'')},
    timing:{advice:t.advice==='wait' ? 'wait' : 'now', event:str(t.event,''), when:str(t.when,''), why:picks.length ? str(t.why,'') : ''},
    ask:{q:str(a.q,''), options:strList(a.options,4)}, chips:strList(j.chips,4), remember:strList(j.remember,4)};
}
function remember(list){
  var have = S.app.memory.map(norm), added = [];
  list.forEach(function(t){ var k = norm(t); if(k && have.indexOf(k)<0 && !/카드|주소|전화|연락처|\d{4}-?\d{4}-?\d{4}/.test(t)){ S.app.memory.push(t); have.push(k); added.push(t); } });
  if(added.length){ S.app.memory = S.app.memory.slice(-60); persist('app'); }
  return added;
}
function liveUpdate(text){
  var L = S.ui.live; if(!L) return;
  var m = /"say"\s*:\s*"((?:[^"\\]|\\.)*)/.exec(text);
  if(m){ try{ L.say = JSON.parse('"'+m[1].replace(/\\u[0-9a-fA-F]{0,3}$|\\$/,'')+'"'); }catch(e){} }
  L.n = (text.match(/"name"\s*:/g)||[]).length;
  var s = document.getElementById('live-say'); if(s) s.textContent = L.say;
  var st = document.getElementById('live-status'); if(st) st.textContent = liveStatus();
}
function send(text, opt){
  opt = opt || {};
  text = String(text||'').trim();
  var img = opt.img!==undefined ? opt.img : S.ui.img;
  if(!text && !img){ toast('무엇을 찾을지 적어 주세요.'); var d = document.getElementById('draft'); if(d) d.focus(); return; }
  if(!sample){ aiMissing(); return; }
  if(S.ui.busy){ toast('답을 만드는 중이에요. 잠시만 기다려 주세요.'); return; }
  if(img && !S.ui.imgOk){ img = null; }
  var c = opt.fresh ? newChat() : (curChat() || newChat());
  if(!text) text = '이 사진 속 상품을 찾아줘.';
  c.msgs.push({id:'m'+uid(), role:'user', text:text, img:!!img, star:!!opt.star, at:Date.now()});
  if(!c.title) c.title = text.slice(0,40);
  c.at = Date.now();
  S.ui.draft = ''; S.ui.img = null; S.tab = 'ask'; S.cur = c.id;
  runTurn(c, img ? [img.blob] : null, !!opt.star || !!c.msgs[0].star);
}
function runTurn(c, images, star){
  var ctl = turnCtl = new AbortController();
  var first = c.msgs.filter(function(m){ return m.role==='user'; }).length===1;
  S.ui.busy = c.id; S.ui.live = {say:'', n:0};
  persist('chats'); render(); scrollBottom();
  var o = {modelTier:first || star ? 'complex' : 'default', cache:false, signal:ctl.signal, onText:function(u){ if(ctl===turnCtl) liveUpdate(u.text); }};
  if(images) o.images = images;
  sample.json(turnPrompt(c, !!images, star), o).then(function(j){
    if(ctl!==turnCtl) return;
    var r = normAi(j);
    var m = {id:'m'+uid(), role:'ai', at:Date.now(), kind:r.kind, say:r.say, title:r.title, query:r.query, picks:r.picks, owned:r.owned, cheaper:r.cheaper, timing:r.timing, ask:r.ask, chips:r.chips, remembered:remember(r.remember), basket:null};
    if(!m.say && !m.picks.length) m.say = '답을 정리하지 못했어요. 조금 다르게 말해 주세요.';
    c.msgs.push(m); c.msgs = c.msgs.slice(-30); c.at = Date.now();
    finish();
    if(S.tab==='ask' && S.cur===c.id) scrollToEl('m-'+m.id);
  }).catch(function(e){
    if(ctl!==turnCtl) return;
    if(e && e.code==='cancelled'){
      var last = c.msgs[c.msgs.length-1];
      if(last && last.role==='user'){ c.msgs.pop(); if(!String(S.ui.draft||'').trim()) S.ui.draft = last.text; }
      if(!c.msgs.length){ S.chats = S.chats.filter(function(x){ return x!==c; }); S.cur = null; }
      finish(); toast('멈췄어요. 고쳐서 다시 보내 주세요.');
      return;
    }
    c.msgs.push({id:'m'+uid(), role:'ai', at:Date.now(), err:aiError(e), star:star, picks:[]});
    finish();
  });
  function finish(){ turnCtl = null; S.ui.busy = null; S.ui.live = null; persist('chats'); render(); }
}

/* 카드 사진: 카드사와 상품명만 읽고, 사진은 저장하지 않는다 */
function runCardPhoto(files){
  if(!sample){ aiMissing(); return; }
  if(!S.ui.imgOk){ toast('이 화면에서는 사진을 읽을 수 없어요. 카드 이름으로 추가해 주세요.'); return; }
  files = files.slice(0, S.ui.imgMax || 1);
  S.ui.cardPhotoBusy = true; render();
  Promise.all(files.map(function(f){ return shrink(f, 1280).then(function(s){ return s.blob; }); })).then(function(blobs){
    var prompt = '첨부 사진은 사용자가 자기 결제 카드를 찍은 것이다. 사진 속 카드마다 카드사(issuer)와 카드 상품명(product)만 읽는다. 카드 번호, 이름, 유효기간, CVC, 바코드 같은 다른 글자는 절대 출력하지 않는다. 상품명이 카드에 보이지 않으면 디자인으로 알 수 있는 범위에서 짐작하고 confidence를 low로 한다. 결제 카드가 아니면 cards를 빈 배열로 둔다. kind는 신용카드면 credit, 체크카드면 check다.\nJSON 하나만 답한다:\n{"cards":[{"issuer":"현대카드","product":"현대카드 M","kind":"credit","confidence":"high"}]}';
    return sample.json(prompt, {modelTier:'default', cache:false, images:blobs});
  }).then(function(j){
    var list = (j && Array.isArray(j.cards) ? j.cards : []).map(function(x){ x = x || {}; return {name:str(x.product, str(x.issuer,'')), kind:x.kind==='check' ? 'check' : 'credit', guess:x.confidence!=='high'}; }).filter(function(x){ return x.name; }).slice(0,6);
    if(!list.length){ toast('카드를 알아보지 못했어요. 카드 이름으로 추가해 주세요.'); return; }
    var added = [];
    list.forEach(function(x){
      if(S.app.wallet.cards.some(function(c){ return norm(c.name)===norm(x.name); })) return;
      S.app.wallet.cards.push({id:uid(), name:x.name, kind:x.kind, met:'unknown', freeInstall:0, benefits:[], guess:x.guess});
      added.push(S.app.wallet.cards.length-1);
    });
    persist('app');
    toast(added.length ? '카드 '+added.length+'장을 등록했어요. 혜택을 채우는 중이에요.' : '이미 등록된 카드예요.');
    fillQueue(added);
  }).catch(function(e){ toast(aiError(e)); }).then(function(){ S.ui.cardPhotoBusy = false; render(); });
}
function fillQueue(list){ if(!list.length) return; var i = list.shift(); aiFillCard(i, function(){ fillQueue(list); }); }
function aiFillCard(i, done){
  var c = S.app.wallet.cards[i];
  function end(){ if(done) done(); }
  if(!c || !String(c.name||'').trim()){ toast('카드 이름을 먼저 적어 주세요.'); end(); return; }
  if(!sample){ aiMissing(); end(); return; }
  S.ui.cardBusy = i; render();
  var prompt = '한국 카드 상품 "'+c.name+'"의 결제 혜택을 아는 범위에서 정리한다. 온라인 쇼핑, 배달앱, 특정 쇼핑몰의 할인·적립, 전월 실적 조건, 무이자 할부를 중심으로 본다. 확실하지 않으면 benefits를 비우고 confidence를 "low"로 한다. 혜택은 최대 4개다.\n'
    + 'type: discount(청구할인·즉시할인), cashback, points(포인트 적립)\nscope: online(온라인 쇼핑 전체), delivery(배달앱), merchant(특정 가맹점, merchants에 이름), all(모든 가맹점)\nrate는 퍼센트 숫자, cap은 월 한도(원, 없으면 0), freeInstallMonths는 상시 무이자 할부 최대 개월(모르면 0).\n'
    + 'JSON 하나만 답한다:\n{"kind":"credit","benefits":[{"type":"discount","rate":10,"scope":"merchant","merchants":["쿠팡","네이버"],"cap":10000,"label":"쿠팡·네이버 10% 청구할인"}],"minSpend":300000,"freeInstallMonths":0,"confidence":"high","note":"전월 실적 30만 원 이상일 때 적용"}';
  sample.json(prompt, {modelTier:'default', cache:{gcTime:86400000}}).then(function(j){
    j = j && typeof j==='object' ? j : {};
    if(S.app.wallet.cards[i]!==c) return;
    c.kind = j.kind==='check' ? 'check' : (j.kind==='credit' ? 'credit' : c.kind);
    c.benefits = (Array.isArray(j.benefits) ? j.benefits : []).slice(0,4).map(function(b){ b = b || {}; return {type:BTYPE[b.type] ? b.type : 'discount', rate:num(b.rate), scope:['online','delivery','merchant','all'].indexOf(b.scope)>=0 ? b.scope : 'online', merchants:Array.isArray(b.merchants) ? b.merchants.join(', ') : String(b.merchants||''), cap:num(b.cap), label:str(b.label,'')}; }).filter(function(b){ return b.rate>0; });
    if(num(j.freeInstallMonths)>=2) c.freeInstall = Math.floor(num(j.freeInstallMonths));
    c.ai = {note:str(j.note,''), confidence:j.confidence==='high' ? 'high' : 'low'};
    persist('app');
    toast(c.benefits.length ? c.name+' 혜택을 채웠어요. 카드사 안내와 다르면 고쳐 주세요.' : c.name+'의 혜택은 확실하지 않아요. 직접 추가해 주세요.');
  }).catch(function(e){ toast(aiError(e)); }).then(function(){ S.ui.cardBusy = null; render(); end(); });
}

function twoStep(key, fn){ if(S.ui.confirm===key){ S.ui.confirm = null; fn(); } else { S.ui.confirm = key; } render(); }
function rootOf(k){ if(k==='app') return S.app; if(k==='ui') return S.ui; return null; }
function setPath(path, v){
  var parts = path.split('.'), o = rootOf(parts[0]); if(!o) return;
  for(var i=1;i<parts.length-1;i++){ var k = parts[i]; if(o[k]==null || typeof o[k]!=='object') o[k] = {}; o = o[k]; }
  o[parts[parts.length-1]] = v;
}
function afterSet(path){ if(path.split('.')[0]==='app') persist('app'); }
function addCardByName(){

  var i = S.app.wallet.cards.length-1; S.ui.newCard = ''; S.ui.editCard = i; persist('app'); render();
  if(sample) aiFillCard(i);

function addMemory(){

}
function onFile(el){

});
$app.addEventListener('keydown', function(e){
  if(e.key!=='Enter' || e.isComposing || e.keyCode===229) return;
  var id = e.target && e.target.id;
  if(id==='draft' && !e.shiftKey){ e.preventDefault(); send(S.ui.draft); }
  else if(id==='newCard'){ e.preventDefault(); addCardByName(); }
  else if(id==='memNew'){ e.preventDefault(); addMemory(); }
  else if(id==='star-name'){ e.preventDefault(); A.starGo(); }
});

/* ---------- boot ---------- */
var cached = lsLoad(LS_KEY), migrated = false;
if(cached){ S.app = mergeApp(cached.app); S.chats = mergeChats(cached.chats); }
else { var old = lsLoad('gyeot.v1'); if(old && old.app){ S.app = fromV3(old.app, old.closet); migrated = true; lsSave(); } }
render();

(function boot(){
  var c = window.claude;
  if(!c || typeof c.use!=='function'){ aiState = 'off'; render(); return; }
  c.use('sample').then(function(s){
    sample = s; aiState = s ? 'on' : 'off';
    if(s && s.limits){ s.limits().then(function(l){ S.ui.imgOk = !!(l && l.images); S.ui.imgMax = l && l.images ? l.images.maxCount : 0; render(); }, function(){}); }
    render();
  }, function(){ aiState = 'off'; render(); });
  c.use('comments').then(function(cm){ comments = cm; if(cm) render(); }, function(){});
  Promise.all([c.use('user'), c.use('db')]).then(function(x){
    var u = x[0], d = x[1]; if(!u || !d) return null;
    return u.id().then(function(id){
      if(!id) return null;
      var base = 'data/users/'+id;
      var r = {app:d.doc(base+'/ag_app'), chats:d.doc(base+'/ag_chats')};
      return Promise.all([r.app.get(), r.chats.get()]).then(function(g){
        refs.app = r.app; refs.chats = r.chats; storage = 'cloud';
        var T = demoBackup || S; /* 예시를 보는 중이면 계정 데이터는 보관본에 넣는다 */
        var q = g[1].exists && g[1].data();
        if(q && Array.isArray(q.list)) T.chats = mergeChats(q);
        else if(T.chats.length) persist('chats');
        if(g[0].exists){ T.app = mergeApp(g[0].data()); lsSave(); render(); return null; }
        if(cached || migrated){ persist('app'); render(); return null; }
        /* 계정에 새 기록이 없으면 이전 버전(곁)의 결제수단·취향을 옮겨 온다 */
        return Promise.all([d.doc(base+'/app').get(), d.doc(base+'/closet').get()]).then(function(o){
          if(o[0].exists){ T.app = fromV3(o[0].data(), o[1].exists ? o[1].data() : null); persist('app'); }
          lsSave(); render();
        }, function(){ render(); });
      });
    });
  }).catch(function(){ /* 계정 저장소를 못 쓰면 이 기기에만 저장 */ });
})();
})();
</script>
