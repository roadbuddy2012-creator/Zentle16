<title>곁 쇼핑 비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 440px) — sticky brand header, one screen at a time, fixed 5-tab bar. Follows the 곁 V0.1 화면 시안: cream ground, deep green actions, soft green panels. */
:root{
  --bg:#F5F3EC;
  --surface:#FFFFFF;
  --tint:#E7EEE5;
  --tint-2:#D3E1D1;
  --green:#245A43;
  --on-green:#FFFFFF;
  --green-2:#3B775A;
  --ink:#1D2621;
  --muted:#5F6A63;
  --line:#E0DDD3;
  --warn:#94491A;
  --warn-bg:#F6E7D8;
  --font-ui:"IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-brand:"Gowun Dodum", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101512; --surface:#18201B; --tint:#1E2A23; --tint-2:#2A3B31;
    --green:#8BCBA8; --on-green:#0C1811; --green-2:#A6D8BB;
    --ink:#E5EBE7; --muted:#9AA69E; --line:#2B352F; --warn:#EDAA77; --warn-bg:#35271C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201B; --tint:#1E2A23; --tint-2:#2A3B31;
  --green:#8BCBA8; --on-green:#0C1811; --green-2:#A6D8BB;
  --ink:#E5EBE7; --muted:#9AA69E; --line:#2B352F; --warn:#EDAA77; --warn-bg:#35271C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.minw{min-width:0}

.app{max-width:440px;margin:0 auto;padding-inline:20px;padding-block:0 calc(108px + env(safe-area-inset-bottom,0px))}
.app.no-tabs{padding-block-end:40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.mark{width:30px;height:30px;border-radius:9px;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.mark .ic{width:18px;height:18px}
.mark.mini{width:22px;height:22px;border-radius:7px}
.mark.mini .ic{width:13px;height:13px}
.brand-name{font-family:var(--font-brand);font-size:25px;line-height:1}
.brand-sub{font-size:12.5px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.sm{width:32px;height:32px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:4px}
.cm-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tint-2);border-radius:14px;padding:10px 14px;font-size:13px}
.demo-bar button{border:0;background:none;color:var(--green);font-weight:600;font-size:13px;cursor:pointer;padding:2px 0;flex:none}

.screen{display:flex;flex-direction:column;gap:18px;padding-block:6px 8px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:13.5px;padding:4px 0;cursor:pointer}
.stack-tight{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12.5px;font-weight:500;color:var(--green-2);letter-spacing:.02em}
h1{font-size:27px;line-height:1.32;font-weight:400;letter-spacing:-.015em;margin:2px 0 0;text-wrap:balance}
h1.big{font-size:31px}
h1.h-prod{font-size:24px}
h2{font-size:15.5px;font-weight:600;margin:0}
.lead{color:var(--muted);font-size:14px}
.hint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fine{font-size:12px;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13.5px;font-weight:500;display:block}
.sec-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.actions{display:flex;flex-direction:column;gap:6px;margin-top:2px}

.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;background:var(--green);color:var(--on-green);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;padding:0 16px}
.btn-primary[disabled]{opacity:.45;cursor:default}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer;text-decoration:none;padding:0 14px;text-align:center}
.btn-link{border:0;background:none;color:var(--muted);font-size:14.5px;padding:8px;cursor:pointer;align-self:center}
.btn-small{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:13.5px;cursor:pointer;text-decoration:none;flex:none}
.btn-small.strong{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn-small[disabled]{opacity:.55;cursor:default}
.btn-inline{border:0;background:none;color:var(--green);font-size:14px;font-weight:500;padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;text-align:left}
.btn-inline.danger{color:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.tint{background:var(--tint);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.t-title{font-weight:500;display:flex;align-items:center;gap:6px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--green-2);color:var(--green);font-weight:500}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.field::placeholder{color:var(--muted);opacity:.75}
textarea.field{resize:vertical;min-height:84px}
.field.num{font-variant-numeric:tabular-nums}
.field.xs{width:70px;text-align:right;padding:9px 10px}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.progress span{height:4px;border-radius:4px;background:var(--tint-2)}
.progress span.on{background:var(--green)}
details>summary{cursor:pointer;font-size:14px;color:var(--green);font-weight:500;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ "}
details[open]>summary::before{content:"− "}
details.more-info{display:flex;flex-direction:column;gap:10px}
details.more-info[open]>summary{margin-bottom:10px}
details.more-info>div{margin-bottom:10px}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--green);font-weight:500;white-space:nowrap}
.pill.done{background:var(--line);color:var(--muted)}
.pill.ready{background:var(--green);color:var(--on-green)}
.pill.bad,.pill.est{background:var(--warn-bg);color:var(--warn)}

/* welcome */
.hero{background:var(--tint);border-radius:24px;padding:22px 22px 26px;display:flex;flex-direction:column;gap:8px}
.hero-mark{width:84px;height:84px;border-radius:24px;background:var(--surface);color:var(--green);display:grid;place-items:center;margin-bottom:26px}
.hero-mark .ic{width:34px;height:34px;stroke-width:1.3}
.features{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.features li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.f-ico{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--green);display:grid;place-items:center}
.features b{display:block;font-weight:500;font-size:15.5px}
.features small{font-size:13px;color:var(--muted)}

/* home */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.composer:focus-within{border-color:var(--green-2)}
.composer textarea{border:0;background:transparent;resize:vertical;min-height:84px;font-size:16px;padding:0;outline:none}
.composer textarea::placeholder{color:var(--muted);opacity:.75}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.send{width:46px;height:46px;border-radius:14px;border:0;background:var(--green);color:var(--on-green);display:grid;place-items:center;cursor:pointer;flex:none}
.list{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:28px 1fr 16px;gap:10px;align-items:center;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.ex b{font-weight:500;display:block}
.ex small{color:var(--muted);font-size:12.5px}
.ex .ic{color:var(--green-2)}
.link-card{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer}
.link-card b{display:block;font-weight:500}
.link-card small{color:var(--muted);font-size:13px}
.mem-line{font-weight:500}
.sale{display:grid;grid-template-columns:96px 1fr;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.sale:last-child{border-bottom:0;padding-bottom:0}
.sale-when{font-size:12.5px;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.45}
.sale-name{font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sale-note{grid-column:2;font-size:12.5px;color:var(--muted)}

/* clarify */
.bubble-me{align-self:flex-end;max-width:88%;background:var(--tint);border-radius:18px 18px 6px 18px;padding:12px 14px}
.ai-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.bubble-ai{background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.bubble-ai .q{font-weight:500}
.intent{border-left:3px solid var(--green-2);padding-left:10px;font-size:14px}
.q-label{font-size:12.5px;color:var(--muted)}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:5px;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* searching */
.hero-ic{width:64px;height:64px;border-radius:18px;background:var(--tint);color:var(--green);display:grid;place-items:center}
.hero-ic .ic{width:28px;height:28px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.step .ic{margin-top:2px}
.step.done{color:var(--ink)}
.step.done .ic{color:var(--green)}
.step.active{color:var(--ink)}
.step.active .ic{color:var(--green-2);animation:pulse 1.4s ease-in-out infinite}
.step-title{font-weight:500}
.step-sub{font-size:12.5px;color:var(--muted)}
@keyframes pulse{50%{opacity:.3}}

/* recommendations */
.rec{display:flex;flex-direction:column;gap:12px}
.rec.top-pick{border:1.5px solid var(--green-2)}
.rec-head{display:flex;gap:8px;align-items:center}
.rank{width:24px;height:24px;border-radius:7px;background:var(--tint);color:var(--green);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.tag{background:var(--tint);color:var(--green);font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px}
.rec-body{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start}
.thumb{width:84px;height:84px;border-radius:14px;background:var(--tint);color:var(--green);display:grid;place-items:center;flex:none}
.thumb .ic{width:38px;height:38px;stroke-width:1.3}
.rec-name{font-weight:500;font-size:16px}
.rec-reason{color:var(--muted);font-size:13px;margin:2px 0 6px}
.price{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.price.big{font-size:26px}
.price-sub{font-size:12px;color:var(--muted)}
.why{font-size:14px}
.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pros-cons ul{margin:4px 0 0;padding-left:16px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.pros-cons .sec-label{color:var(--green-2)}
.pros-cons .cons .sec-label{color:var(--warn)}
.mini{font-size:13px}
.mini b{font-weight:600;margin-right:6px}
.pop{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.pop .ic{margin-top:2px;color:var(--green-2)}
.rec-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.coordi{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.coordi .cl-item{width:76px;flex:none}
.li{display:grid;grid-template-columns:22px 56px 1fr 16px;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.li .thumb{width:56px;height:56px;border-radius:12px}
.li .thumb .ic{width:26px;height:26px}
.li .rank{background:none;color:var(--muted);font-weight:500}
.li .rec-reason{margin:0}
.li .price{font-size:16px}
.hero-thumb{aspect-ratio:16/10;max-width:100%;border-radius:20px;background:var(--tint);color:var(--green);display:grid;place-items:center}
.hero-thumb .ic{width:76px;height:76px;stroke-width:1.05}
.rows{display:flex;flex-direction:column;gap:12px}
.rows.sep{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:14px;font-size:14px}
.row>span:first-child{color:var(--muted);flex:none}
.row>b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;min-width:0}
.row.total{border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.row.total>b{font-weight:600}
.row.sub>span:first-child,.row.sub>b{font-size:13px;color:var(--muted);font-weight:400}
.links{display:flex;flex-wrap:wrap;gap:8px}
.callout{display:flex;flex-direction:column;gap:8px}
.callout-head{display:flex;align-items:center;gap:8px;font-weight:600}
.callout-head .ic{color:var(--green-2)}
.callout ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.check-list{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}

/* payment options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer}
.opt[aria-checked="true"]{border:1.5px solid var(--green-2);background:var(--tint)}
.opt-title{display:flex;align-items:center;gap:8px;font-weight:500}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:inline-grid;place-items:center;flex:none}
.opt[aria-checked="true"] .radio{border-color:var(--green)}
.opt[aria-checked="true"] .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.badge{margin-left:auto;font-size:12px;color:var(--green);font-weight:600}
.opt-amt{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.opt-method{font-size:13.5px;font-weight:500}
.opt-detail{font-size:12.5px;color:var(--muted)}
.assume ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}

/* ready / feedback */
.mini-prod{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.mini-prod .thumb{width:72px;height:72px}
.mini-prod .thumb .ic{width:32px;height:32px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green);margin-top:3px;flex:none}
.checks{gap:10px}
.choice{min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.choice[aria-pressed="true"]{background:var(--tint);border-color:var(--green-2);color:var(--green);font-weight:500}

/* lists */
.req{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.req-main{text-align:left;border:0;background:none;padding:14px 0;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.req-text{font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.req-meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.buy{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.buy .thumb{width:48px;height:48px;border-radius:12px}
.buy .thumb .ic{width:22px;height:22px}
.buy-name{font-weight:500}
.buy-meta{font-size:12.5px;color:var(--muted)}
.buy-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.buy-price{font-variant-numeric:tabular-nums;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat-n{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stat-l{font-size:12px;color:var(--muted)}
.empty{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:18px;border:1px dashed var(--line);border-radius:18px}
.notes{list-style:none;padding:0;margin:0}
.notes li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

/* closet */
.closet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cl-item{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0;color:var(--ink)}
.ph{display:block;width:100%;aspect-ratio:1;border-radius:14px;background-color:var(--tint);background-repeat:no-repeat}
.ph-ic{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:14px;background:var(--tint);color:var(--green)}
.ph-ic .ic{width:28px;height:28px;stroke-width:1.3}
.cl-item[aria-pressed="true"] .ph,.cl-item[aria-pressed="true"] .ph-ic{outline:2px solid var(--green-2);outline-offset:2px}
.cl-name{font-size:12.5px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cl-meta{font-size:11.5px;color:var(--muted)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wq-row{display:grid;grid-template-columns:22px 56px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wq-row .ph,.wq-row .ph-ic{width:56px}
.wq-row .field{padding:8px 10px;font-size:15px;border-radius:10px}
.wq-fields{display:grid;grid-template-columns:1fr 92px;gap:6px}
.body-sum{display:flex;flex-direction:column;gap:6px;font-size:14px}
.body-sum ul{margin:0;padding-left:18px;font-size:13.5px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.board-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--green-2);color:var(--green);font-size:12px;text-align:center;padding:6px}

/* wallet */
.pc{background:var(--green);color:var(--on-green);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border:0;text-align:left;width:100%}
.pc-top{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85}
.pc-name{font-size:18px;font-weight:500}
.pc-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;flex-wrap:wrap}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.seg-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.inline-field{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.ben{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-radius:14px;background:var(--tint)}
.ben .field{padding:9px 10px;font-size:15px;border-radius:10px}
.ben .full{grid-column:1/-1}
.ben .inline-field .field{width:84px;text-align:right}
.ben .right{justify-self:end}
.ai-note{color:var(--green-2)}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.prow .full{grid-column:1/-1}
.prow .field{padding:9px 10px;font-size:15px;border-radius:10px}
.prow-name{font-weight:500}
.add-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.file-btn:focus-within{outline:2px solid var(--green-2);outline-offset:2px}
.li-check{padding:10px 0;border-bottom:1px solid var(--line)}
.li-check b{display:block;font-weight:500}
.li-check small{color:var(--muted);font-size:12.5px}

/* tab bar + toast */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer}
.tab[aria-current="page"]{color:var(--green);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.no-tabs~.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:359px){.pros-cons,.qa-btns{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.step.active .ic,.dots i{animation:none}}

  if(demoBackup) return;
  lsSave();
  if(!refs[key]) return;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(function(){ writeRemote(key, 0); }, 600);
}
function remoteBody(key){
  if(key==='app') return clone(S.app);
  if(key==='closet') return clone(S.closet);
  return {list: clone(key==='requests' ? S.requests.slice(0,20) : S.purchases.slice(0,200))};
}
function writeRemote(key, attempt){
  refs[key].set(remoteBody(key)).catch(function(e){
    if(e && e.code==='unavailable' && attempt===0){ setTimeout(function(){ writeRemote(key,1); }, 800+Math.random()*1200); }
    else { toast('계정에 저장하지 못했어요. 이 기기에는 남아 있어요.'); }
  });
}

/* ---------- photos: shrink in the page, keep in the artifact's private asset store ---------- */
function shrink(file, max){
  max = max || 1280;
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max/Math.max(w,h));
      var c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w*k)); c.height = Math.max(1,Math.round(h*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ if(b) res({blob:b, r:c.width/c.height}); else rej({code:'decode'}); }, 'image/jpeg', 0.84);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej({code:'decode'}); };
    img.src = url;
  });
}
function savePhoto(blob){
  if(!assets) return Promise.resolve(null);
  return assets.upload(blob, {type:'image/jpeg'}).then(function(r){ return r.id; }).catch(function(e){
    if(e && e.code==='quota_or_state') toast('사진 저장 공간이 가득 찼어요. 안 쓰는 사진을 지워 주세요.');
    return null;
  });
}
function photoInUse(id){
  if(S.closet.body.photo && S.closet.body.photo.id===id) return true;
  return S.closet.items.some(function(i){ return i.photo && i.photo.id===id; });
}
function dropPhoto(id){ if(id && assets && !photoInUse(id)){ assets.delete(id).catch(function(){}); } }
function fetchPhoto(id){ return fetch('/_blob/'+id).then(function(r){ return r.ok ? r.blob() : null; }).catch(function(){ return null; }); }
/* A square tile showing one photo, zoomed to the item's box when the AI gave one. */
function photoTile(photo, box, iconName){
  if(!photo || !/^[A-Za-z0-9_-]{8,64}$/.test(String(photo.id||''))) return '<span class="ph-ic">'+ic(iconName||'hanger')+'</span>';
  var st = 'background-image:url(/_blob/'+photo.id+');';
  var r = num(photo.r) || 1;
  if(Array.isArray(box) && box.length===4){
    var x = Math.min(Math.max(num(box[0]),0),1), y = Math.min(Math.max(num(box[1]),0),1);
    var w = Math.min(Math.max(num(box[2]),.12),1), h = Math.min(Math.max(num(box[3]),.12),1);
    var A = 1/Math.max(w, h/r);
    var px = A===1 ? .5 : Math.min(Math.max((.5-(x+w/2)*A)/(1-A),0),1);
    var py = (A/r)===1 ? .5 : Math.min(Math.max((.5-(y+h/2)*(A/r))/(1-A/r),0),1);
    st += 'background-size:'+(A*100).toFixed(1)+'% auto;background-position:'+(px*100).toFixed(1)+'% '+(py*100).toFixed(1)+'%';
  } else {
    st += 'background-size:cover;background-position:center';
  }
  return '<span class="ph" style="'+st+'" role="img" aria-label="옷 사진"></span>';
}

var ONB = ['welcome','taste','onbWallet','onbHistory'];
var FLOW = ['clarify','searching','recs','more','detail','pay','ready','feedback','manual'];
function tabOf(r){ if(r==='home') return 'home'; if(r==='shopping' || FLOW.indexOf(r)>=0) return 'shopping'; if(r==='closet') return 'closet'; if(r==='history') return 'history'; if(r==='wallet') return 'wallet'; return ''; }
function go(to, opt){
  opt = opt || {};
  if(!opt.replace && S.route!==to) S.stack.push(S.route);
  S.route = to; S.ui.confirm = null;
  render(); window.scrollTo(0,0);
}
function back(){
  if(S.route==='searching' && searchCtl){ searchCtl.abort(); }
  S.route = S.stack.pop() || (S.app.onboarded ? 'home' : 'welcome');
  S.ui.confirm = null;
  render(); window.scrollTo(0,0);
}
function render(){
  var a = document.activeElement, aid = a && a.id, s0 = null, s1 = null;
  try{ if(a && typeof a.selectionStart==='number'){ s0 = a.selectionStart; s1 = a.selectionEnd; } }catch(e){}

  $app.innerHTML = '<div class="app'+(showTabs?'':' no-tabs')+'">'+header()+'<main class="screen" id="screen">'+(demoBackup?'<div class="demo-bar"><span>예시 데이터로 둘러보는 중이에요. 바꾼 내용은 저장되지 않아요.</span><button data-act="exitDemo">예시 끝내기</button></div>':'')+view()+'</main></div>'+(showTabs?tabs():'')+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');

}
var toastTimer;
function toast(m){
  S.toast = m;
  var t = document.querySelector('.toast');
  if(!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); $app.appendChild(t); }
  t.textContent = m;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ S.toast=''; var x=document.querySelector('.toast'); if(x) x.remove(); }, 3000);
}

/* ---------- 결제 계산 (금액은 코드가 계산) ---------- */
function hit(list, where){
  var w = String(where||'').replace(/\s+/g,'').toLowerCase(); if(!w) return false;
  return String(list||'').split(/[,/·\n]+/).map(function(s){ return s.replace(/\s+/g,'').toLowerCase(); }).filter(Boolean).some(function(m){ return w.indexOf(m)>=0 || m.indexOf(w)>=0; });
}
function payUsable(p, item){ return !String(p.where||'').trim() || hit(p.where, item.where); }
function benefitOf(card, item, base){
  var out = {amount:0, type:'discount', capped:false, cap:0, rate:0};
  if(!card || card.met==='no') return out;
  (card.benefits||[]).forEach(function(b){
    var rate = num(b.rate); if(rate<=0) return;
    var sc = b.scope || 'online';
    var ok = sc==='all' || (sc==='online' && item.channel==='online') || (sc==='delivery' && item.channel==='delivery') || (sc==='merchant' && hit(b.merchants, item.where));
    if(!ok) return;
    var amt = Math.floor(base*rate/100), cap = num(b.cap), capped = false;
    if(cap>0 && amt>cap){ amt = cap; capped = true; }
    if(amt>out.amount){ out = {amount:amt, type:BTYPE[b.type]?b.type:'discount', capped:capped, cap:cap, rate:rate}; }
  });
  return out;
}
function combo(card, pay, item, base){
  var b = benefitOf(card, item, base);
  var disc = b.type==='discount' ? b.amount : 0;
  var cardLater = b.type!=='discount' ? b.amount : 0;
  var payR = pay ? Math.floor(base*num(pay.rate)/100) : 0;
  var now = base - disc;
  return {card:card, pay:pay, b:b, disc:disc, cardLater:cardLater, payR:payR, later:cardLater+payR, now:now, real:now-cardLater-payR, points:0, months:0, base:base};
}
function extend(o, extra){ var r = {}; for(var k in o) r[k]=o[k]; for(var k2 in extra) r[k2]=extra[k2]; return r; }
function options(item){
  var w = S.app.wallet, base = num(item.price) + num(item.shipping);
  var cards = w.cards.filter(function(c){ return c.name; }), pays = w.pays.filter(function(p){ return p.name; });
  var all = [combo(null,null,item,base)];
  cards.forEach(function(c){ all.push(combo(c,null,item,base)); pays.forEach(function(p){ if(payUsable(p,item)) all.push(combo(c,p,item,base)); }); });
  pays.forEach(function(p){ if(payUsable(p,item)) all.push(combo(null,p,item,base)); });
  function cnt(x){ return (x.card?1:0)+(x.pay?1:0); }
  function by(a,b){ return (a.real-b.real) || (cnt(a)-cnt(b)); }
  var best = all.slice().sort(by)[0];
  var hasWallet = cards.length || pays.length;
  var list = [extend(best, {key:'best', title: hasWallet ? '총비용을 줄이는 추천' : '일반 결제', rec: !!hasWallet})];
  var cardOnly = all.filter(function(x){ return x.card && !x.pay; }).sort(by)[0];
  if(cardOnly && !(cardOnly.card===best.card && !best.pay)) list.push(extend(cardOnly, {key:'card', title:'카드로 바로 결제'}));
  var pts = w.points.filter(function(p){ return p.name && num(p.balance)>0 && (!String(p.where||'').trim() || hit(p.where, item.where)); });
  var bal = pts.reduce(function(s,p){ return s+num(p.balance); }, 0);
  if(bal>0){ list.push(extend(best, {key:'cash', title:'이번 현금 지출을 줄이기', points:Math.min(bal, best.now), pointNames:pts.map(function(p){ return p.name; })})); }
  if(base>=50000){
    var inst = cards.map(function(c){ return {c:c, m:Math.floor(num(c.freeInstall))}; }).filter(function(x){ return x.m>=2; }).sort(function(a,b){ return b.m-a.m; })[0];
    if(inst){ list.push(extend(combo(inst.c,null,item,base), {key:'split', title:'월 부담을 나누기', months:inst.m})); }
  }
  return {base:base, list:list};
}
function payNow(o){ return o.now - (o.points||0); }
function monthly(o){ return o.months ? Math.ceil(payNow(o)/o.months/10)*10 : 0; }
function methodLabel(o){
  var parts = [o.pay && o.pay.name, o.card && o.card.name].filter(Boolean);
  if(o.points){ var pn = (o.pointNames||[]).join('·'); parts.push(/포인트|마일리지/.test(pn) ? pn : pn+' 포인트'); }
  if(parts.length) return parts.join(' + ');
  return (S.app.wallet.cards.length || S.app.wallet.pays.length) ? '일반 결제' : '결제수단 등록 전';
}
function detailLine(o){
  var d = [];
  if(o.disc) d.push('카드 할인 '+won(o.disc));
  if(o.cardLater) d.push('카드 '+(o.b.type==='points'?'포인트':'캐시백')+' '+won(o.cardLater));
  if(o.payR) d.push(o.pay.name+' 적립 '+won(o.payR));
  if(o.points) d.push('포인트 '+won(o.points)+' 사용 · 총 사용 가치 '+won(o.now));
  if(o.months) d.push('월 약 '+won(monthly(o))+' · 총 '+won(payNow(o)));
  if(!d.length) d.push((S.app.wallet.cards.length || S.app.wallet.pays.length) ? '이 구매처에 맞는 등록 혜택이 없어요' : '결제수단을 등록하면 비교해드려요');
  return d.join(' · ');
}
function assumptions(o){
  var a = [];
  if(o.card && o.card.met!=='yes') a.push(o.card.name+': 전월 실적이 '+(o.card.met==='no'?'미충족이라 카드 혜택을 빼고':'확인 전이라 충족했다고 보고')+' 계산했어요.');
  if(o.b && o.b.capped) a.push('월 할인 한도 '+won(o.b.cap)+'까지만 반영했어요.');
  if(o.card && o.pay) a.push(o.pay.name+'로 결제할 때도 '+o.card.name+' 혜택이 들어오는지 확인하세요.');
  if(o.pay && !String(o.pay.where||'').trim()) a.push('구매처에서 '+o.pay.name+'를 쓸 수 있는지 확인하세요.');
  if(o.months) a.push('무이자 할부는 카드사와 구매처 조건(최소 금액, 기간)을 확인하세요.');
  a.push('쿠폰과 멤버십 할인은 구매처에서 확인하세요.');
  a.push('상품 가격이 다르면 위에서 고치면 바로 다시 계산해요.');
  return a;
}
function chosen(r, item){ var l = options(item).list; for(var i=0;i<l.length;i++){ if(l[i].key===r.payKey) return l[i]; } return l[0]; }

/* ---------- 사이트별 순위 확인 링크 ---------- */
function siteUrls(q){
  var e = encodeURIComponent(q);
  return {
    coupang:'https://www.coupang.com/np/search?q='+e+'&sorter=saleCountDesc',
    naver:'https://search.shopping.naver.com/search/all?query='+e+'&sort=review',
    ali:'https://ko.aliexpress.com/w/wholesale-'+encodeURIComponent(String(q).trim().replace(/\s+/g,'-'))+'.html?SortType=total_tranpro_desc',
    temu:'https://www.temu.com/kr/search_result.html?search_key='+e,
    musinsa:'https://www.musinsa.com/search/goods?keyword='+e
  };
}
function storeUrl(where, q){
  var u = siteUrls(q), w = String(where||'');
  if(/쿠팡/.test(w)) return u.coupang;
  if(/알리/.test(w)) return u.ali;
  if(/테무/i.test(w)) return u.temu;
  if(/무신사/.test(w)) return u.musinsa;
  return u.naver;
}
function rankLinks(it, fashion){
  var u = siteUrls(it.searchQuery || it.name);

   + (fashion ? '<a class="chip" href="'+u.musinsa+'" target="_blank" rel="noopener">무신사 '+ic('ext','sm')+'</a>' : '<a class="chip" href="'+u.ali+'" target="_blank" rel="noopener">알리 주문 많은순 '+ic('ext','sm')+'</a>')

  if(!items.length){

    CATS.forEach(function(c){

        + (list.some(function(w){ return w.id===S.ui.wsel; }) ? itemEditor(closetItem(S.ui.wsel)) : '') + '</section>';
    });
  }
  return h;
}

  var f = b[0].label || ((BTYPE[b[0].type]||'할인')+' '+num(b[0].rate)+'%');

  editCard:function(el){ var i = +el.dataset.i; S.ui.editCard = S.ui.editCard===i ? null : i; S.ui.confirm = null; render(); },
  setVal:function(el){ setPath(el.dataset.path, el.dataset.v); afterSet(el.dataset.path); render(); },
  addCard:function(){
    var n = String(S.ui.newCard||'').trim(); if(!n){ toast('카드 상품명을 적어 주세요.'); return; }
    S.app.wallet.cards.push({id:uid(), name:n, kind:'credit', met:'unknown', freeInstall:0, benefits:[]});
    var i = S.app.wallet.cards.length-1; S.ui.newCard = ''; S.ui.editCard = i; persist('app'); render();
    if(sample) aiFillCard(i);
  },
  aiCard:function(el){ aiFillCard(+el.dataset.i); },
  addBenefit:function(el){ var c = S.app.wallet.cards[+el.dataset.i]; c.benefits = c.benefits || []; c.benefits.push({type:'discount', rate:'', scope:'online', merchants:'', cap:''}); persist('app'); render(); },
  delBenefit:function(el){ S.app.wallet.cards[+el.dataset.i].benefits.splice(+el.dataset.j, 1); persist('app'); render(); },
  delCard:function(el){ var i = +el.dataset.i; twoStep('card'+i, function(){ S.app.wallet.cards.splice(i,1); S.ui.editCard = null; persist('app'); }); },
  addPay:function(el){ S.app.wallet.pays.push({name:el.dataset.v, rate:'', where:''}); persist('app'); render(); },
  addPayCustom:function(){ var n = String(S.ui.newPay||'').trim(); if(!n){ toast('Pay 이름을 적어 주세요.'); return; } S.app.wallet.pays.push({name:n, rate:'', where:''}); S.ui.newPay = ''; persist('app'); render(); },
  delPay:function(el){ S.app.wallet.pays.splice(+el.dataset.i, 1); persist('app'); render(); },
  addPoint:function(){ S.app.wallet.points.push({name:'', balance:'', where:''}); persist('app'); render(); var x = document.getElementById('ptn'+(S.app.wallet.points.length-1)); if(x) x.focus(); },
  delPoint:function(el){ S.app.wallet.points.splice(+el.dataset.i, 1); persist('app'); render(); },
  delNote:function(el){ S.app.profile.notes.splice(+el.dataset.i, 1); persist('app'); render(); },
  resetAll:function(){ twoStep('reset', function(){
    var ids = S.closet.items.map(function(w){ return w.photo && w.photo.id; }).concat([S.closet.body.photo && S.closet.body.photo.id]).filter(Boolean);
    S.app = freshApp(); S.closet = freshCloset(); S.requests = []; S.purchases = []; S.ui = {}; S.stack = []; S.route = 'welcome';
    if(assets) ids.forEach(function(id){ assets.delete(id).catch(function(){}); });
    persist('app'); persist('closet'); persist('requests'); persist('purchases');
  }); },
  manualGo:function(){
    var m = S.ui.manual || {};
    var name = String(m.name||'').trim(), price = num(m.price);
    if(!name || price<=0){ toast('상품 이름과 가격을 적어 주세요.'); return; }
    var it = {name:name, brand:'', tag:'', reason:'직접 고른 상품', why:'', pros:[], cons:[], fit:'', popularity:'', check:[], specs:'', price:price, est:price, shipping:num(m.shipping), where:String(m.where||'').trim() || '온라인', channel:m.channel||'online', searchQuery:name, eta:'', icon:'box', coordi:[], manual:true};
    var r = {id:uid(), text:name+' 결제 비교', createdAt:Date.now(), status:'recommended', manual:true, clarify:null, answers:{}, extra:'', recs:{intent:'', conditions:'직접 고른 상품', category:'etc', channel:it.channel, items:[it], owned:{enough:false, items:[], why:''}, cheaper:{show:false}, timing:{}}, sel:0, payKey:'best', checks:{}, fb:{}};
    S.requests.unshift(r); S.requests = S.requests.slice(0,20); S.curId = r.id; S.ui.manual = null; persist('requests');
    go('pay', {replace:true});
  },
  importRun:function(){ runImport(); },
  importCancel:function(){ S.ui.importResult = null; render(); },
  importSave:function(){
    var res = S.ui.importResult; if(!res) return;
    var ps = res.purchases.filter(function(p){ return p.pick; }), ns = res.notes.filter(function(n){ return n.pick; });
    ps.forEach(function(p){ S.purchases.push({id:uid(), date:p.date, name:p.name, where:p.store, price:p.price, method:'', saved:0, icon:p.fashion?'clothing':'box', cat:p.fashion?'fashion':'', source:'import'}); });
    S.purchases.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
    ns.forEach(function(n){ S.app.profile.notes.push(n.text); }); S.app.profile.notes = S.app.profile.notes.slice(-20);
    S.ui.importResult = null; S.ui.importText = ''; S.ui.importFiles = [];
    persist('purchases'); persist('app'); render();
    toast((ps.length+ns.length) ? (ps.length ? '구매 '+ps.length+'건' : '취향 단서')+'을 기억했어요.' : '아무것도 고르지 않았어요.');
  },
  copy:function(el){
    var t = el.dataset.v;
    try{ navigator.clipboard.writeText(t).then(function(){ toast('복사했어요.'); }, function(){ toast('복사하지 못했어요. 글자를 길게 눌러 복사해 주세요.'); }); }
    catch(e){ toast('복사하지 못했어요. 글자를 길게 눌러 복사해 주세요.'); }
  }
};

$app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el || !$app.contains(el)) return;
  var f = A[el.dataset.act]; if(!f) return;
  e.preventDefault(); f(el, e);
});
$app.addEventListener('input', function(e){
  var el = e.target; if(!el.dataset || !el.dataset.bind || el.type==='checkbox' || el.tagName==='SELECT') return;
  var v = el.hasAttribute('data-num') ? (el.value.trim()==='' ? '' : num(el.value)) : el.value;
  setPath(el.dataset.bind, v); afterSet(el.dataset.bind);
});
$app.addEventListener('change', function(e){
  var el = e.target;
  if(el.dataset.file){ onFile(el); el.value = ''; return; }
  if(el.dataset.pick){
    if(el.dataset.pick==='w'){ var wq = S.ui.wq; if(wq && wq.result) wq.result[+el.dataset.i].pick = el.checked; return; }
    var res = S.ui.importResult; if(res){ (el.dataset.pick==='p' ? res.purchases : res.notes)[+el.dataset.i].pick = el.checked; } return;
  }
  if(el.dataset.bind && (el.type==='checkbox' || el.tagName==='SELECT')){ setPath(el.dataset.bind, el.type==='checkbox' ? el.checked : el.value); afterSet(el.dataset.bind); if(el.hasAttribute('data-rerender') || el.dataset.bind.indexOf('wsel.')===0) render(); return; }
  if(el.hasAttribute('data-recalc')) render();
});

/* ---------- boot ---------- */
var cached = lsLoad();
if(cached){ S.app = mergeApp(cached.app); S.closet = mergeCloset(cached.closet); S.requests = Array.isArray(cached.requests) ? cached.requests : []; S.purchases = Array.isArray(cached.purchases) ? cached.purchases : []; }
S.route = S.app.onboarded ? 'home' : 'welcome';
render();

(function boot(){
  var c = window.claude;
  if(!c || typeof c.use!=='function'){ aiState = 'off'; render(); return; }
  c.use('sample').then(function(s){
    sample = s; aiState = s ? 'on' : 'off';
    if(s && s.limits){ s.limits().then(function(l){ S.ui.imgOk = !!(l && l.images); S.ui.imgMax = l && l.images ? l.images.maxCount : 0; render(); }, function(){}); }
    render();
  });
  c.use('assets').then(function(a){ assets = a; });
  c.use('comments').then(function(cm){ comments = cm; if(cm) render(); });
  Promise.all([c.use('user'), c.use('db')]).then(function(x){
    var u = x[0], d = x[1]; if(!u || !d) return null;
    return u.id().then(function(id){
      if(!id) return null;
      var base = 'data/users/'+id;
      var r = {app:d.doc(base+'/app'), closet:d.doc(base+'/closet'), requests:d.doc(base+'/requests'), purchases:d.doc(base+'/purchases')};
      return Promise.all([r.app.get(), r.closet.get(), r.requests.get(), r.purchases.get()]).then(function(g){
        refs.app = r.app; refs.closet = r.closet; refs.requests = r.requests; refs.purchases = r.purchases; storage = 'cloud';
        var T = demoBackup || S; /* 예시를 보는 중이면 계정 데이터는 보관본에 넣는다 */
        if(g[0].exists) T.app = mergeApp(g[0].data()); else if(cached) persist('app');
        if(g[1].exists) T.closet = mergeCloset(g[1].data()); else if(cached && cached.closet) persist('closet');
        var q = g[2].exists && g[2].data(), p = g[3].exists && g[3].data();
        if(q && Array.isArray(q.list)) T.requests = clone(q.list); else if(T.requests.length) persist('requests');
        if(p && Array.isArray(p.list)) T.purchases = clone(p.list); else if(T.purchases.length) persist('purchases');
        lsSave();
        if(S.route==='welcome' && S.app.onboarded){ S.route = 'home'; }
        render();
      });
    });
  }).catch(function(){ /* 계정 저장소를 못 쓰면 이 기기에만 저장 */ });
})();
})();
</script>
