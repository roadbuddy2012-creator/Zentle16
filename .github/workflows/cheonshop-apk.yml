name: 천샵 APK

on:
  push:
    branches: ['claude/compassionate-mendel-g77p6m', 'main']
    paths: ['cheonshop/**', '.github/workflows/cheonshop-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheonshop-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cheonshop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cheonshop/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: cheonshop/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "cheonshop-0.1.${{ github.run_number }}.apk"

      # 모든 빌드가 같은 시제품 키로 서명돼야 휴대폰에서 덮어 설치(업데이트)가 된다
      - name: Check the APK is signed with the prototype key
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "cheonshop-0.1.${{ github.run_number }}.apk" | tee signer.txt
          grep -qi 'ee8b1560fc2f641935cc835b5475857eadd05bd32bfdad609daee1e068363f54' signer.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cheonshop-apk-0.1.${{ github.run_number }}
          path: cheonshop/cheonshop-0.1.${{ github.run_number }}.apk

      - name: Publish a prerelease with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.1.1은 시제품 키가 아닌 임시 키로 서명돼 다음 버전으로 업데이트가 안 된다. 남아 있으면 지운다
          if gh release view cheonshop-v0.1.1 >/dev/null 2>&1; then
            gh release delete cheonshop-v0.1.1 --cleanup-tag --yes
          fi
          TAG="cheonshop-v0.1.${{ github.run_number }}"
          gh release create "$TAG" "cheonshop-0.1.${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "천샵 시제품 0.1.${{ github.run_number }}" \
            --notes "휴대폰에서 APK를 내려받아 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱 설치'를 허용해야 해요. 시제품 서명이라 테스트용이에요. 새 버전은 지우지 말고 덮어 설치하면 돼요. 커밋: ${{ github.sha }}"
